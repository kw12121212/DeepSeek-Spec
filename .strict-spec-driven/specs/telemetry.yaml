schema: strict-spec-driven/spec/v1
schema_version: 1
artifact_type: main_spec
spec:
  id: telemetry
  title: Telemetry and Cost Tracking
requirements:
  usage-log-append:
    strength: MUST
    statement: >-
      appendUsage MUST append a turn record as a JSONL line to ~/.reasonix/usage.jsonl with
      timestamp, session, model, token counts, and costs. Disk failures MUST NOT break the chat.
    scenarios:
      append-record:
        - GIVEN: a valid AppendUsageInput with model and usage data
        - WHEN: appendUsage is called
        - THEN: a JSONL line is appended to the usage log and a UsageRecord is returned
      disk-failure-silent:
        - GIVEN: a disk write failure
        - WHEN: appendUsage is called
        - THEN: the error is silently ignored and no exception propagates
  usage-log-read:
    strength: MUST
    statement: >-
      readUsageLog MUST read and parse all usage records, skipping malformed JSON lines. Returns an
      empty array if the file does not exist.
    scenarios:
      read-records:
        - GIVEN: a usage.jsonl with 10 valid records
        - WHEN: readUsageLog is called
        - THEN: 10 UsageRecord objects are returned
      missing-file:
        - GIVEN: no usage.jsonl file exists
        - WHEN: readUsageLog is called
        - THEN: an empty array is returned without throwing
      malformed-skipped:
        - GIVEN: a usage.jsonl with 8 valid lines and 2 malformed lines
        - WHEN: readUsageLog is called
        - THEN: 8 valid records are returned, malformed lines are skipped
  log-compaction:
    strength: MUST
    statement: >-
      appendUsage MUST compact the log when it exceeds 5MB, retaining only the last 365 days of
      records.
    scenarios:
      auto-compact:
        - GIVEN: a usage.jsonl exceeding 5MB
        - WHEN: appendUsage is called
        - THEN: the log is compacted to records from the last 365 days
  cost-calculation:
    strength: MUST
    statement: >-
      costUsd MUST return the total USD cost for a model and usage. Returns 0 when pricing data is
      unavailable. pricingFor MUST return undefined when the model is not in pricing tables.
    scenarios:
      known-model:
        - GIVEN: model "deepseek-v4-pro" with known pricing and usage data
        - WHEN: costUsd is called
        - THEN: a non-zero USD cost is returned
      unknown-model:
        - GIVEN: model "unknown-model"
        - WHEN: costUsd is called
        - THEN: 0 is returned
  cache-savings:
    strength: MUST
    statement: >-
      cacheSavingsUsd MUST calculate the USD savings from cache hit tokens compared to full input
      token pricing.
    scenarios:
      savings-positive:
        - GIVEN: a model with cache pricing and 1000 cache hit tokens
        - WHEN: cacheSavingsUsd is called
        - THEN: a positive USD value is returned representing savings
  session-stats:
    strength: MUST
    statement: >-
      SessionStats MUST track per-turn usage and cost, support carryover seeding for session
      resumption, and provide totalCost, savingsVsClaude, and aggregateCacheHitRatio getters. Must
      auto-trim to MAX_TURNS (200).
    scenarios:
      cumulative-cost:
        - GIVEN: 3 turns with known costs
        - WHEN: totalCost getter is accessed
        - THEN: the sum of all turn costs is returned
      carryover-resume:
        - GIVEN: prior session totals
        - WHEN: seedCarryover is called
        - THEN: totals include both carryover and new session data
      auto-trim:
        - GIVEN: 250 turns recorded
        - WHEN: turn 251 is recorded
        - THEN: only the last 200 turns are retained
  aggregate-usage:
    strength: MUST
    statement: >-
      aggregateUsage MUST create rolling window aggregates (today, week, month, all-time) with
      breakdowns by model and session.
    scenarios:
      time-buckets:
        - GIVEN: usage records spanning 60 days
        - WHEN: aggregateUsage is called
        - THEN: today, week (last 7 days), month (last 30 days), and all-time buckets are populated
  subagent-distillation:
    strength: MUST
    statement: >-
      computeSpawnDistillation MUST calculate token compression metrics for a subagent spawn.
      summarizeSubagentSession MUST aggregate multiple spawn metrics.
    scenarios:
      compression-ratio:
        - GIVEN: a subagent result with completion and output tokens
        - WHEN: computeSpawnDistillation is called
        - THEN: a compression ratio is calculated
  spawn-storm-detection:
    strength: MUST
    statement: >-
      countSpawnStorms MUST count turns with >=threshold spawns (detecting runaway parallel
      spawning).
    scenarios:
      storm-counted:
        - GIVEN: 3 turns with 5, 2, and 6 spawns respectively and threshold 5
        - WHEN: countSpawnStorms is called
        - THEN: 2 storms are counted
  brand-rename:
    strength: MUST
    statement: All telemetry source code references to 'reasonix' are replaced with DeepSeek-Spec naming
    scenarios:
      grep-clean:
        - GIVEN: dependency changes are applied
        - WHEN: grep -ri reasonix src/telemetry/ is executed
        - THEN: zero matches are returned
mapping:
  implementation:
    - src/telemetry/usage.ts
    - src/telemetry/stats.ts
    - src/telemetry/subagent-distillation.ts
  tests:
    - tests/telemetry.test.ts
    - tests/usage.test.ts
    - tests/subagent-distillation.test.ts

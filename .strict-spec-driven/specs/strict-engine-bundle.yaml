schema: strict-spec-driven/spec/v1
schema_version: 1
artifact_type: main_spec
spec:
  id: strict-engine-bundle
  title: Strict Spec Engine Bundle
requirements:
  engine-shipped:
    strength: MUST
    statement: >-
      The published npm package MUST include vendor/strict-spec-driven.js in its files array so the
      engine is available after install.
    scenarios:
      engine-resolvable:
        - GIVEN: the package is installed via npm
        - WHEN: runtime code resolves vendor/strict-spec-driven.js relative to dist/
        - THEN: the file exists and is a valid CommonJS module
  engine-path-resolver:
    strength: MUST
    statement: >-
      A runtime resolver MUST locate the engine file at vendor/strict-spec-driven.js relative to the
      package root.
    scenarios:
      path-resolution:
        - GIVEN: the package is installed
        - WHEN: resolveEnginePath() is called
        - THEN: it returns an absolute path to vendor/strict-spec-driven.js that exists on disk
  invoker-wraps-subcommands:
    strength: MUST
    statement: >-
      invokeStrict(subcommand, args) MUST spawn the bundled engine with the given subcommand and
      args, capture stdout and stderr, parse JSON output when present, and return { ok, data?,
      error? }.
    scenarios:
      happy-path-json:
        - GIVEN: a valid subcommand that returns JSON on stdout
        - WHEN: invokeStrict('roadmap-status', []) is called
        - THEN: the result has ok=true and data contains the parsed JSON object
  invoker-error-handling:
    strength: MUST
    statement: >-
      When the child process exits non-zero, invokeStrict MUST return { ok: false, error: <stderr or
      last error line> } without throwing.
    scenarios:
      non-zero-exit:
        - GIVEN: the engine subprocess exits with code 1 and writes an error to stderr
        - WHEN: invokeStrict is called
        - THEN: the result has ok=false and error contains the stderr message
  invoker-subcommand-coverage:
    strength: MUST
    statement: >-
      The Subcommand type MUST include all supported subcommands: init, propose, generate, apply,
      verify, ready, archive, ship, cancel, roadmap-status, roadmap-sync, roadmap-recommend.
    scenarios:
      all-subcommands-accepted:
        - GIVEN: the Subcommand union type is defined
        - WHEN: each supported subcommand string is passed to invokeStrict
        - THEN: TypeScript accepts it at compile time and the function dispatches correctly at runtime
  builtin-skill-registration:
    strength: MUST
    statement: >-
      The BUILTIN_SKILLS array MUST include entries for each core strict-spec workflow skill:
      strict-init, strict-propose, strict-apply, strict-verify, strict-review, strict-archive,
      strict-ship, strict-cancel, strict-brainstorm, strict-modify, strict-roadmap-recommend,
      strict-roadmap-plan, strict-auto.
    scenarios:
      all-skills-registered:
        - GIVEN: the SkillStore is initialized with default builtins enabled
        - WHEN: list() is called
        - THEN: >-
            the result includes 13 strict-spec skill entries with scope=builtin and names prefixed
            with strict-
  slash-commands-registered:
    strength: MUST
    statement: >-
      The SLASH_COMMANDS array MUST include entries for each /strict-* command: /strict-init,
      /strict-propose, /strict-apply, /strict-verify, /strict-review, /strict-archive, /strict-ship,
      /strict-cancel, /strict-brainstorm, /strict-modify, /strict-roadmap-recommend, /strict-auto.
      Each entry MUST have group='strict' and dispatch to the corresponding built-in skill.
    scenarios:
      all-strict-commands-visible:
        - GIVEN: the SLASH_COMMANDS array is loaded
        - WHEN: suggestSlashCommands('/strict') is called
        - THEN: all 12 /strict-* commands are returned with group 'strict'
  tool-registry-entries:
    strength: MUST
    statement: >-
      The ToolRegistry MUST include entries for each strict-spec subcommand: strict_propose,
      strict_generate, strict_apply, strict_verify, strict_ready, strict_archive, strict_ship,
      strict_cancel, strict_roadmap_status, strict_roadmap_sync, strict_roadmap_recommend.
    scenarios:
      all-tools-registered:
        - GIVEN: the ToolRegistry is initialized with default tools
        - WHEN: list() is called and filtered for tools prefixed with strict_
        - THEN: exactly 11 tool entries are returned, one for each supported subcommand
  tool-handler-invokes-engine:
    strength: MUST
    statement: >-
      Each strict tool handler MUST call invokeStrict() with the corresponding subcommand name and
      the tool's input args, and return the structured result.
    scenarios:
      handler-dispatch:
        - GIVEN: a strict tool is invoked with a valid changeName and subcommand-specific fields
        - WHEN: the tool handler runs
        - THEN: >-
            invokeStrict is called with the correct subcommand and the result is returned to the
            caller
  tool-parallel-safety:
    strength: MUST
    statement: >-
      All strict tool definitions MUST have parallelSafe set to false since they mutate filesystem
      state under .strict-spec-driven/.
    scenarios:
      no-concurrent-strict-ops:
        - GIVEN: a strict tool is registered in the ToolRegistry
        - WHEN: its parallelSafe field is inspected
        - THEN: it is false for every strict tool
mapping:
  implementation:
    - vendor/strict-spec-driven.js
    - src/strict/engine-path.ts
  tests:
    - tests/strict-engine-bundle.test.ts

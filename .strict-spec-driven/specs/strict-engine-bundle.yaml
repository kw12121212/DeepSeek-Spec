schema: strict-spec-driven/spec/v1
schema_version: 1
artifact_type: main_spec
spec:
  id: strict-engine-bundle
  title: Strict Spec Engine Bundle
requirements:
  engine-shipped:
    strength: MUST
    statement: >-
      The published npm package MUST include vendor/strict-spec-driven.js in its files array so the
      engine is available after install.
    scenarios:
      engine-resolvable:
        - GIVEN: the package is installed via npm
        - WHEN: runtime code resolves vendor/strict-spec-driven.js relative to dist/
        - THEN: the file exists and is a valid CommonJS module
  engine-path-resolver:
    strength: MUST
    statement: >-
      A runtime resolver MUST locate the engine file at vendor/strict-spec-driven.js relative to the
      package root.
    scenarios:
      path-resolution:
        - GIVEN: the package is installed
        - WHEN: resolveEnginePath() is called
        - THEN: it returns an absolute path to vendor/strict-spec-driven.js that exists on disk
  invoker-wraps-subcommands:
    strength: MUST
    statement: >-
      invokeStrict(subcommand, args) MUST spawn the bundled engine with the given subcommand and
      args, capture stdout and stderr, parse JSON output when present, and return { ok, data?,
      error? }.
    scenarios:
      happy-path-json:
        - GIVEN: a valid subcommand that returns JSON on stdout
        - WHEN: invokeStrict('roadmap-status', []) is called
        - THEN: the result has ok=true and data contains the parsed JSON object
  invoker-error-handling:
    strength: MUST
    statement: >-
      When the child process exits non-zero, invokeStrict MUST return { ok: false, error: <stderr or
      last error line> } without throwing.
    scenarios:
      non-zero-exit:
        - GIVEN: the engine subprocess exits with code 1 and writes an error to stderr
        - WHEN: invokeStrict is called
        - THEN: the result has ok=false and error contains the stderr message
  invoker-subcommand-coverage:
    strength: MUST
    statement: >-
      The Subcommand type MUST include all supported subcommands: init, propose, generate, apply,
      verify, ready, archive, ship, cancel, brainstorm, roadmap-status, roadmap-sync,
      roadmap-recommend, auto-pipeline.
    scenarios:
      all-subcommands-accepted:
        - GIVEN: the Subcommand union type is defined
        - WHEN: each supported subcommand string is passed to invokeStrict
        - THEN: TypeScript accepts it at compile time and the function dispatches correctly at runtime
  builtin-skill-registration:
    strength: MUST
    statement: >-
      The BUILTIN_SKILLS array MUST include entries for each core strict-spec workflow skill:
      strict-init, strict-propose, strict-apply, strict-verify, strict-review, strict-archive,
      strict-ship, strict-cancel, strict-brainstorm, strict-modify, strict-roadmap-recommend,
      strict-roadmap-plan, strict-auto.
    scenarios:
      all-skills-registered:
        - GIVEN: the SkillStore is initialized with default builtins enabled
        - WHEN: list() is called
        - THEN: >-
            the result includes 13 strict-spec skill entries with scope=builtin and names prefixed
            with strict-
  slash-commands-registered:
    strength: MUST
    statement: >-
      The SLASH_COMMANDS array MUST include entries for each /strict-* command: /strict-init,
      /strict-propose, /strict-apply, /strict-verify, /strict-review, /strict-archive, /strict-ship,
      /strict-cancel, /strict-brainstorm, /strict-modify, /strict-roadmap-recommend, /strict-auto.
      Each entry MUST have group='strict' and dispatch to the corresponding built-in skill.
    scenarios:
      all-strict-commands-visible:
        - GIVEN: the SLASH_COMMANDS array is loaded
        - WHEN: suggestSlashCommands('/strict') is called
        - THEN: all 12 /strict-* commands are returned with group 'strict'
  tool-registry-entries:
    strength: MUST
    statement: >-
      The ToolRegistry MUST include entries for strict_roadmap_status, strict_roadmap_sync,
      strict_ready, strict_generate, and strict_brainstorm with parallelSafe=false. roadmap tools
      MUST NOT require changeName. ready and generate MUST require changeName. brainstorm MUST NOT
      require changeName.
    scenarios:
      roadmap-status-registered:
        - GIVEN: the ToolRegistry is initialized with default tools
        - WHEN: list() is called and filtered for strict_roadmap_status
        - THEN: >-
            exactly one tool entry is returned with parallelSafe=false and no changeName in its
            parameter schema
      ready-tool-registered:
        - GIVEN: the ToolRegistry is initialized with default tools
        - WHEN: list() is called and filtered for strict_ready
        - THEN: >-
            exactly one tool entry is returned with parallelSafe=false and changeName in its
            parameter schema
      generate-tool-registered:
        - GIVEN: the ToolRegistry is initialized with default tools
        - WHEN: list() is called and filtered for strict_generate
        - THEN: >-
            exactly one tool entry is returned with parallelSafe=false and changeName in its
            parameter schema
      brainstorm-tool-registered:
        - GIVEN: the ToolRegistry is initialized with default tools
        - WHEN: list() is called and filtered for strict_brainstorm
        - THEN: >-
            exactly one tool entry is returned with parallelSafe=false and no changeName in its
            parameter schema
  tool-handler-invokes-engine:
    strength: MUST
    statement: >-
      Each strict tool handler MUST call invokeStrict() with the corresponding subcommand name and
      the tool's input args, and return the structured result. State-guarded tools MUST call
      requireState before invoking the subcommand.
    scenarios:
      handler-dispatch:
        - GIVEN: a strict tool is invoked with a valid changeName and subcommand-specific fields
        - WHEN: the tool handler runs
        - THEN: >-
            invokeStrict is called with the correct subcommand and the result is returned to the
            caller
      state-guard-rejects:
        - GIVEN: a state-guarded tool is invoked for a change in the wrong state
        - WHEN: the tool handler runs
        - THEN: the handler returns the requireState error without calling invokeStrict
  state-guards:
    strength: MUST
    statement: >-
      STATE_GUARDS MUST define required states for apply (proposed), generate (proposed), verify
      (applied), archive (reviewed), ship (archived), and cancel (proposed, applied). Each guarded
      tool MUST check via requireState before dispatch.
    scenarios:
      apply-requires-proposed:
        - GIVEN: a change in verified state
        - WHEN: strict_apply is invoked
        - THEN: the tool returns a state mismatch error without calling the apply subcommand
  tool-parallel-safety:
    strength: MUST
    statement: >-
      All strict tool definitions MUST have parallelSafe set to false since they mutate filesystem
      state under .strict-spec-driven/.
    scenarios:
      no-concurrent-strict-ops:
        - GIVEN: a strict tool is registered in the ToolRegistry
        - WHEN: its parallelSafe field is inspected
        - THEN: it is false for every strict tool
  auto-pipeline-subcommand:
    strength: MUST
    statement: >-
      The Subcommand type MUST include 'auto-pipeline' as a supported subcommand and invokeStrict
      MUST accept and dispatch it correctly.
    scenarios:
      auto-pipeline-dispatch:
        - GIVEN: the Subcommand union type includes auto-pipeline
        - WHEN: invokeStrict('auto-pipeline', ['my-change']) is called
        - THEN: >-
            the engine subprocess receives auto-pipeline as the subcommand and returns a valid
            result
  auto-tool-registered:
    strength: MUST
    statement: >-
      The ToolRegistry MUST include an entry for strict_auto with parallelSafe=false and a
      changeName parameter and an optional --from flag.
    scenarios:
      auto-tool-visible:
        - GIVEN: the ToolRegistry is initialized with default tools
        - WHEN: list() is called and filtered for strict_auto
        - THEN: >-
            exactly one tool entry is returned with parallelSafe=false and changeName in its
            parameter schema
  auto-step-sequencing:
    strength: MUST
    statement: >-
      AutoPipeline MUST execute steps in order: recommend, apply, verify, review (dispatched as the
      ready subcommand), archive, ship. Each step MUST call the corresponding invokeStrict
      subcommand and MUST run npm run verify as a gate check before proceeding to the next step.
    scenarios:
      full-pipeline-run:
        - GIVEN: a valid change name and no --from flag
        - WHEN: run() is called
        - THEN: all six steps execute in order and each gate check passes before the next step starts
      review-dispatches-ready:
        - GIVEN: the pipeline reaches the review step
        - WHEN: the review step executes
        - THEN: invokeStrict is called with the 'ready' subcommand, not 'review'
      gate-failure-pause:
        - GIVEN: a change where the verify step returns a non-zero exit code
        - WHEN: run() reaches the verify step
        - THEN: >-
            the pipeline pauses and returns a structured error describing the gate failure without
            proceeding to review
  from-flag-resume:
    strength: MUST
    statement: >-
      AutoPipeline MUST accept an optional --from flag to start execution from any named step,
      skipping completed steps.
    scenarios:
      resume-from-verify:
        - GIVEN: a change that has already completed recommend and apply steps
        - WHEN: 'run({ from: ''verify'' }) is called'
        - THEN: the pipeline starts at verify and does not re-run recommend or apply
  roadmap-sync-after-archive:
    strength: MUST
    statement: >-
      After the archive step completes successfully, AutoPipeline MUST call
      milestoneAdvance(changeName) to check and update milestone status, then call
      invokeStrict('roadmap-sync', []) to sync the roadmap INDEX.yaml. If milestoneAdvance updates
      a milestone, roadmap-sync MUST be called a second time after the advancement.
    scenarios:
      sync-called:
        - GIVEN: a change that passes through archive successfully
        - WHEN: the archive step gate check passes
        - THEN: milestoneAdvance is called, roadmap-sync is called at least once, and the pipeline
            proceeds to ship
      milestone-advance-triggers-second-sync:
        - GIVEN: a change whose archival completes the last planned change in a milestone
        - WHEN: milestoneAdvance updates the milestone status to complete
        - THEN: roadmap-sync is called a second time to reflect the milestone update
  freeform-pipeline:
    strength: MUST
    statement: >-
      When the strict_auto tool is called with a description argument, AutoPipeline MUST run the
      freeform variant: propose (using the description), apply, verify, review (ready), archive,
      ship. This replaces the roadmap-driven recommend step with a propose step using the provided
      description and changeName.
    scenarios:
      freeform-with-description:
        - GIVEN: the strict_auto tool is called with a description and changeName
        - WHEN: the tool handler executes
        - THEN: runFreeformPipeline is called which runs propose first, then apply through ship
      freeform-gate-parity:
        - GIVEN: runFreeformPipeline is executing steps after propose
        - WHEN: a gate check fails at any step
        - THEN: the pipeline returns a failed result and does not continue
mapping:
  implementation:
    - vendor/strict-spec-driven.js
    - src/strict/engine-path.ts
  tests:
    - tests/strict-engine-bundle.test.ts

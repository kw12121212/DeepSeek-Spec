schema: strict-spec-driven/spec/v1
schema_version: 1
artifact_type: main_spec
spec:
  id: scheduled-tasks
  title: Scheduled Tasks
requirements:
  cron-parser-fields:
    strength: MUST
    statement: >-
      The cron parser MUST support standard 5-field cron expressions (minute hour day-of-month month
      day-of-week) with wildcards (*), ranges (1-5), steps (*/5, 1-10/2), and lists (1,3,5).
    scenarios:
      valid-expression:
        - GIVEN: A valid 5-field cron expression such as '*/5 * * * *'
        - WHEN: The expression is parsed by parseCron
        - THEN: A CronFields object is returned with the correct set of allowed values for each field
  cron-parser-matching:
    strength: MUST
    statement: >-
      matchesCron MUST return true when a given Date's minute-boundary matches the cron expression,
      and false otherwise.
    scenarios:
      match-check:
        - GIVEN: A cron expression '0 9 * * 1-5' and a Date representing Monday at 09:00
        - WHEN: matchesCron is called with the expression and date
        - THEN: The function returns true
  cron-parser-next-run:
    strength: MUST
    statement: >-
      nextRun MUST return the next matching minute-boundary after a given Date, scanning forward up
      to one full day (1440 minutes).
    scenarios:
      next-run:
        - GIVEN: A cron expression '0 9 * * *' and a Date representing 08:30
        - WHEN: nextRun is called with the expression and date
        - THEN: A Date representing 09:00 on the same day is returned
  cron-parser-describe:
    strength: SHOULD
    statement: >-
      describeCron SHOULD produce human-readable descriptions for common patterns (e.g., '*/5 * * *
      *' → 'every 5 minutes', '0 9 * * 1-5' → 'weekdays at 9:00'). Complex expressions that don't
      match a known pattern fall back to the raw expression with field labels.
    scenarios:
      description:
        - GIVEN: A cron expression '*/5 * * * *'
        - WHEN: describeCron is called
        - THEN: The string 'every 5 minutes' is returned
  cron-parser-error-handling:
    strength: MUST
    statement: >-
      Invalid cron expressions MUST throw an error with a message indicating the expected format
      (e.g., 'Invalid cron: expected 5 fields').
    scenarios:
      invalid-expression:
        - GIVEN: An invalid cron expression with fewer than 5 fields
        - WHEN: parseCron is called
        - THEN: An error is thrown with a descriptive message
  store-persistence:
    strength: MUST
    statement: >-
      TaskStore MUST persist ScheduledTask objects to .dspec/scheduled.json and load them back,
      returning an empty array when the file is missing or contains malformed JSON.
    scenarios:
      round-trip:
        - GIVEN: A TaskStore instance and a ScheduledTask added via add()
        - WHEN: The store is saved and a new TaskStore instance loads from the same file
        - THEN: The loaded array contains the added task with all fields intact
  store-atomic-write:
    strength: MUST
    statement: >-
      TaskStore MUST perform atomic writes by writing to a temporary file and renaming it, ensuring
      the store file is never left in a partially written state.
    scenarios:
      crash-simulation:
        - GIVEN: >-
            A TaskStore with tasks and a simulated crash during write (temp file exists, main file
            missing)
        - WHEN: A new TaskStore instance loads from the file
        - THEN: An empty array is returned without error
  store-crud:
    strength: MUST
    statement: >-
      TaskStore MUST support add, update, remove, getById, getByName, and getEnabled operations. add
      generates an 8-character nanoid. update merges partial fields and updates the updatedAt
      timestamp. remove returns true if the task existed.
    scenarios:
      update-task:
        - GIVEN: A TaskStore with an existing task
        - WHEN: update is called with the task ID and a partial patch
        - THEN: The task is updated with the merged fields and a new updatedAt timestamp
  scheduler-daemon-tick:
    strength: MUST
    statement: >-
      The Scheduler MUST tick at a configurable interval (default 30s, DSPEC_SCHEDULED_TICK_MS,
      minimum 10s) and on each tick fire all enabled tasks whose cron expression matches the current
      minute and that have not already been fired in that minute.
    scenarios:
      tick-fires-due:
        - GIVEN: An enabled task with cron '*/5 * * * *' and the current time at a 5-minute boundary
        - WHEN: The scheduler ticks
        - THEN: The task executor is invoked for that task exactly once
  scheduler-dedup:
    strength: MUST
    statement: >-
      The Scheduler MUST NOT fire the same task twice within the same calendar minute. A lastFired
      map keyed by task ID tracks the epoch-ms of the last execution and suppresses re-firing if the
      current minute boundary matches.
    scenarios:
      dedup-same-minute:
        - GIVEN: A task was fired at 09:00:15 and the scheduler ticks again at 09:00:45
        - WHEN: The tick checks if the task is due
        - THEN: The task is skipped because it was already fired in this minute
  scheduler-stop:
    strength: MUST
    statement: >-
      Scheduler.stop() MUST clear the tick timer and resolve after all in-flight executions complete
      or after a 30-second timeout, whichever comes first.
    scenarios:
      stop-waits-inflight:
        - GIVEN: A task execution is in progress
        - WHEN: stop() is called
        - THEN: stop() waits for the execution to finish (up to 30s) before resolving
  scheduler-status:
    strength: SHOULD
    statement: >-
      Scheduler.getStatus() SHOULD return { running: boolean, nextTick: Date | null, activeCount:
      number } reflecting the current daemon state.
    scenarios:
      status-report:
        - GIVEN: The scheduler is running with 2 active executions
        - WHEN: getStatus() is called
        - THEN: 'It returns { running: true, nextTick: <next tick Date>, activeCount: 2 }'
  scheduler-nonblocking-fire:
    strength: MUST
    statement: >-
      The scheduler tick MUST fire task executions without awaiting them, so a slow task does not
      block subsequent tick processing.
    scenarios:
      nonblocking:
        - GIVEN: Two tasks are due on the same tick
        - WHEN: The tick fires them
        - THEN: Both executions start without waiting for the other to complete
  executor-headless-run:
    strength: MUST
    statement: >-
      TaskExecutor MUST run a scheduled task prompt through CacheFirstLoop with a default system
      prompt and the task prompt as user message, up to DSPEC_SCHEDULED_MAX_TURNS turns (default
      10).
    scenarios:
      headless-execution:
        - GIVEN: >-
            A ScheduledTask with prompt 'check build status' and a configured ModelClient and
            ToolHost
        - WHEN: TaskExecutor.execute() is called
        - THEN: >-
            CacheFirstLoop.run() is invoked with the system prompt and user message, limited to
            maxTurns
  executor-result-type:
    strength: MUST
    statement: >-
      TaskExecutor MUST return a TaskExecutionResult with taskId, startedAt, finishedAt, status
      ('success'|'error'), outputSnippet, and duration fields.
    scenarios:
      success-result:
        - GIVEN: A task that completes successfully
        - WHEN: execute() returns
        - THEN: The result has status 'success', non-empty outputSnippet, and positive duration
  executor-session-isolation:
    strength: MUST
    statement: >-
      TaskExecutor MUST write session files to .dspec/scheduled-sessions/<taskId>/ separately from
      user sessions. Sessions in this directory MUST NOT appear in /sessions list. Auto-cleanup MUST
      keep only the last 5 session files per task after each execution.
    scenarios:
      isolation-cleanup:
        - GIVEN: A task execution that writes a session file
        - WHEN: the execution completes
        - THEN: >-
            the session file is in .dspec/scheduled-sessions/<taskId>/ and older files beyond the 5
            most recent are deleted
  executor-timeout:
    strength: MUST
    statement: >-
      TaskExecutor MUST enforce a configurable timeout (DSPEC_SCHEDULED_TIMEOUT_MS, default
      300000ms) via AbortController. When the timeout fires, the execution MUST be aborted and
      return a TaskExecutionResult with status 'error' and the timeout message as outputSnippet.
    scenarios:
      timeout-abort:
        - GIVEN: A task execution that exceeds the timeout
        - WHEN: the AbortController fires
        - THEN: the loop is aborted and the result has status 'error' with a timeout message
  executor-error-handling:
    strength: MUST
    statement: >-
      When CacheFirstLoop.run() throws, TaskExecutor MUST catch the error and return a
      TaskExecutionResult with status 'error' and the error message as outputSnippet instead of
      propagating the exception.
    scenarios:
      error-catch:
        - GIVEN: A task execution where the agent loop throws an error
        - WHEN: execute() catches the exception
        - THEN: the result has status 'error' with the error message as snippet, no exception propagates
  history-entry-interface:
    strength: MUST
    statement: >-
      HistoryEntry MUST contain taskId, taskName, startedAt, finishedAt, status ('success'|'error'),
      duration (ms), and outputSnippet (string, max 200 chars).
    scenarios:
      entry-round-trip:
        - GIVEN: A HistoryEntry with all fields populated
        - WHEN: the entry is appended and retrieved from HistoryStore
        - THEN: all fields match the original values exactly
  history-store-persistence:
    strength: MUST
    statement: >-
      HistoryStore MUST persist entries to .dspec/scheduled-history.json and load them back,
      returning an empty array when the file is missing or contains malformed JSON.
    scenarios:
      store-round-trip:
        - GIVEN: A HistoryStore with appended entries saved to disk
        - WHEN: a new HistoryStore instance loads from the same file
        - THEN: the loaded entries match the appended entries
  history-store-prune:
    strength: MUST
    statement: >-
      HistoryStore MUST prune entries per task beyond 500, keeping the most recent. Pruning occurs
      at append time.
    scenarios:
      prune-cap:
        - GIVEN: A HistoryStore with 500 entries for a task
        - WHEN: a new entry is appended for that task
        - THEN: the oldest entry is removed so the count remains 500
  history-store-query-by-task:
    strength: MUST
    statement: >-
      HistoryStore.getByTaskId MUST return entries for a specific task in reverse chronological
      order, limited to the given limit (default 20).
    scenarios:
      query-by-task:
        - GIVEN: A HistoryStore with 30 entries for task 'abc123'
        - WHEN: getByTaskId('abc123', 20) is called
        - THEN: the 20 most recent entries are returned in newest-first order
  history-store-get-all:
    strength: MUST
    statement: >-
      HistoryStore.getAll MUST return all entries across all tasks in reverse chronological order,
      limited to the given limit (default 50).
    scenarios:
      get-all:
        - GIVEN: A HistoryStore with entries for multiple tasks
        - WHEN: getAll() is called
        - THEN: entries are returned newest-first across all tasks
  history-snippet-truncation:
    strength: MUST
    statement: HistoryStore.append MUST truncate outputSnippet to 200 characters before persisting.
    scenarios:
      snippet-cap:
        - GIVEN: An entry with outputSnippet longer than 200 characters
        - WHEN: append() is called
        - THEN: the stored snippet is exactly 200 characters
  schedule-history-command:
    strength: MUST
    statement: >-
      /schedule history <name|id> MUST display the last 20 execution log entries for the identified
      task, showing timestamp, status icon (checkmark for success, cross for error), duration in
      seconds, and output snippet preview. All strings MUST be internationalized via t().
    scenarios:
      history-display:
        - GIVEN: A task 'daily-build' with 5 execution history entries
        - WHEN: /schedule history daily-build is invoked
        - THEN: 5 entries are displayed with timestamp, status icon, duration, and snippet for each
  daemon-history-recording:
    strength: MUST
    statement: >-
      After each task execution completes, the scheduler daemon MUST call historyStore.append() with
      the execution result. The executor remains free of persistence concerns.
    scenarios:
      daemon-records-history:
        - GIVEN: A scheduled task that completes execution
        - WHEN: the executor returns a TaskExecutionResult
        - THEN: historyStore.append() is called with a HistoryEntry derived from the result
  schedule-add-command:
    strength: MUST
    statement: >-
      /schedule add <name> --cron <expr> <prompt> MUST validate the cron expression via parseCron(),
      store the task via TaskStore.add(), display the human-readable description via describeCron(),
      and start the scheduler if not running.
    scenarios:
      add-success:
        - GIVEN: A valid name, cron expression '0 9 * * 1-5', and prompt text
        - WHEN: /schedule add daily-build --cron '0 9 * * 1-5' check build status is invoked
        - THEN: >-
            A task is created with an 8-char ID, stored in .dspec/scheduled.json, and the user sees
            a confirmation with the human-readable cron description
  schedule-list-command:
    strength: MUST
    statement: >-
      /schedule list MUST display all tasks in a table with name, cron expression, human-readable
      description, enabled status, next run time, and last run time.
    scenarios:
      list-display:
        - GIVEN: Two scheduled tasks exist in the store
        - WHEN: /schedule list is invoked
        - THEN: A table is displayed showing both tasks with all columns populated
  schedule-remove-command:
    strength: MUST
    statement: >-
      /schedule remove <name|id> MUST remove the task via TaskStore.remove() and confirm deletion.
      Looking up by name or ID.
    scenarios:
      remove-by-id:
        - GIVEN: A task with ID 'abc12345' exists
        - WHEN: /schedule remove abc12345 is invoked
        - THEN: The task is removed from the store and a confirmation message is shown
  schedule-enable-disable-command:
    strength: MUST
    statement: >-
      /schedule enable <name|id> MUST set enabled=true via TaskStore.update() and start the
      scheduler if needed. /schedule disable <name|id> MUST set enabled=false and stop the scheduler
      if no enabled tasks remain.
    scenarios:
      enable-task:
        - GIVEN: A disabled task with name 'daily-build'
        - WHEN: /schedule enable daily-build is invoked
        - THEN: The task is enabled, the scheduler starts if not running, and a confirmation is shown
  schedule-help-fallback:
    strength: MUST
    statement: >-
      /schedule with no subcommand MUST display help text listing all available subcommands and
      their usage.
    scenarios:
      no-subcommand:
        - GIVEN: No subcommand argument is provided
        - WHEN: /schedule is invoked
        - THEN: >-
            Help text is displayed showing add, list, remove, enable, disable, and history
            subcommands
  schedule-cron-error:
    strength: MUST
    statement: >-
      When an invalid cron expression is provided to /schedule add, a clear error message MUST be
      displayed in the format: 'Invalid cron expression: <reason>. Expected 5 fields (min hour dom
      month dow).'
    scenarios:
      invalid-cron:
        - GIVEN: An invalid cron expression 'bad cron' is provided
        - WHEN: /schedule add test --cron 'bad cron' prompt is invoked
        - THEN: An error message is displayed explaining the invalid cron and the expected format
  schedule-i18n:
    strength: MUST
    statement: >-
      All user-facing strings in the /schedule command MUST be internationalized via t() from
      src/i18n/index.ts.
    scenarios:
      i18n-coverage:
        - GIVEN: The i18n system is initialized with any supported language
        - WHEN: /schedule subcommands are invoked
        - THEN: All output strings are resolved via t() lookup
  loop-scheduler-wiring:
    strength: MUST
    statement: >-
      CacheFirstLoop MUST pass the same ModelClient and ToolHost used by the main loop to
      TaskExecutor, ensuring scheduled tasks have full tool access (file, shell, MCP).
    scenarios:
      shared-tool-access:
        - GIVEN: CacheFirstLoop is initialized with a ModelClient and ToolHost
        - WHEN: TaskExecutor is instantiated for scheduled tasks
        - THEN: the executor uses the same ModelClient and ToolHost as the main agent loop
  session-directory-filter:
    strength: MUST
    statement: >-
      The /sessions command MUST filter out sessions under .dspec/scheduled-sessions/ so scheduled
      task sessions are not shown in user session listings.
    scenarios:
      filter-scheduled-sessions:
        - GIVEN: Both user sessions and scheduled task sessions exist on disk
        - WHEN: /sessions is invoked
        - THEN: only user sessions are displayed, scheduled-sessions/ entries are excluded
  tui-status-indicator:
    strength: MUST
    statement: >-
      The TUI MUST display a SchedulerStatus component in the top bar when enabled scheduled tasks
      exist, showing the count of enabled tasks. When the next scheduled run is within 1 hour, the
      component MUST also show the next run time formatted as HH:MM. The component MUST render
      nothing (hidden) when no enabled tasks exist.
    scenarios:
      tui-visible:
        - GIVEN: Enabled scheduled tasks exist
        - WHEN: The TUI top bar renders
        - THEN: A status indicator shows the count of enabled tasks
  tui-status-next-run:
    strength: MUST
    statement: >-
      The SchedulerStatus component MUST show the next run time in HH:MM format when the next
      scheduled execution is within 1 hour, and MUST NOT show the next run time when it is more than
      1 hour away.
    scenarios:
      next-run-within-hour:
        - GIVEN: An enabled task with next run time 30 minutes from now
        - WHEN: The SchedulerStatus component renders
        - THEN: 'The status text includes ''(next: HH:MM)'' where HH:MM is the next run time'
  tui-status-i18n:
    strength: MUST
    statement: >-
      All user-facing strings in the SchedulerStatus component MUST be internationalized via t()
      from src/i18n/index.ts.
    scenarios:
      i18n-strings:
        - GIVEN: The i18n system is initialized with any supported language
        - WHEN: The SchedulerStatus component renders
        - THEN: All display text is resolved via t() lookup
mapping:
  implementation:
    - src/scheduler/cron-parser.ts
    - src/scheduler/store.ts
    - src/scheduler/scheduler.ts
  tests:
    - tests/scheduler/cron-parser.test.ts
    - tests/scheduler/store.test.ts
    - tests/scheduler/scheduler.test.ts

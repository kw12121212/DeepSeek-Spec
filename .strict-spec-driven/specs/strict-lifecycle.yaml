schema: strict-spec-driven/spec/v1
schema_version: 1
artifact_type: main_spec
spec:
  id: strict-lifecycle
  title: Strict Change Lifecycle
requirements:
  valid-transitions:
    strength: MUST
    statement: >-
      ChangeLifecycle MUST allow only the defined valid transitions: proposed->applied,
      proposed->canceled, applied->verified, applied->canceled, verified->reviewed,
      reviewed->archived, archived->shipped.
    scenarios:
      valid-forward:
        - GIVEN: a change in proposed state
        - WHEN: attemptTransition('proposed', 'applied') is called
        - THEN: the state is written to proposal.yaml change.status as applied and no error is thrown
  invalid-transition-rejection:
    strength: MUST
    statement: >-
      ChangeLifecycle MUST throw a descriptive error when attemptTransition is called with an
      invalid (from, to) pair that is not in the transition map.
    scenarios:
      invalid-transition:
        - GIVEN: a change in applied state
        - WHEN: attemptTransition('applied', 'proposed') is called
        - THEN: an error is thrown describing the invalid transition and the state is not changed
  terminal-state-immutable:
    strength: MUST
    statement: >-
      ChangeLifecycle MUST reject all transition attempts from terminal states (shipped, canceled)
      by throwing a descriptive error.
    scenarios:
      terminal-rejection:
        - GIVEN: a change in shipped state
        - WHEN: attemptTransition('shipped', 'proposed') is called
        - THEN: an error is thrown indicating shipped is a terminal state
  read-current-state:
    strength: MUST
    statement: >-
      ChangeLifecycle.readCurrentState(changeName) MUST parse
      .strict-spec-driven/changes/<name>/proposal.yaml change.status and return the typed
      ChangeState value.
    scenarios:
      read-happy-path:
        - GIVEN: 'a change directory with a proposal.yaml containing change.status: applied'
        - WHEN: readCurrentState('my-change') is called
        - THEN: the value 'applied' is returned as a typed ChangeState
  require-state-guard:
    strength: MUST
    statement: >-
      requireState(changeName, ...requiredStates) MUST read the current change state via
      ChangeLifecycle.readCurrentState and return an error string if the state does not match any of
      the required states, or undefined if the state is valid
    scenarios:
      state-mismatch:
        - GIVEN: a change named my-change is in proposed state
        - WHEN: requireState('my-change', 'applied') is called
        - THEN: an error string describing the mismatch is returned and the tool does not execute
  multi-state-guard:
    strength: MUST
    statement: >-
      requireState(changeName, ...requiredStates) MUST accept multiple required states and return
      undefined only if the current state matches at least one of them
    scenarios:
      multi-state-match:
        - GIVEN: a change named my-change is in applied state
        - WHEN: requireState('my-change', 'proposed', 'applied') is called
        - THEN: undefined is returned indicating the guard passed
  tool-dispatch-guarded:
    strength: MUST
    statement: >-
      Each state-guarded strict tool dispatch handler MUST call requireState before invoking the CLI
      subcommand and return the error string as the tool result if the guard rejects the call.
      Guarded tools and their required states are: apply (proposed), generate (proposed), verify
      (applied), archive (reviewed), ship (archived), cancel (proposed, applied).
    scenarios:
      guarded-tool-call:
        - GIVEN: a change named my-change is in proposed state
        - WHEN: strict_verify tool is invoked with changeName my-change
        - THEN: the tool returns the guard error string without invoking the verify CLI subcommand
      ready-requires-proposed:
        - GIVEN: a change in verified state
        - WHEN: strict_generate tool is invoked with changeName my-change
        - THEN: the tool returns a state mismatch error without invoking the generate subcommand
  roadmap-recommend-ignores-completed:
    strength: MUST
    statement: >-
      roadmapRecommend() MUST skip planned changes whose depends_on entries are not found in
      archived strict changes with shipped status.
    scenarios:
      dependency-not-resolved:
        - GIVEN: a planned change with depends_on referencing a change that has not been archived
        - WHEN: roadmapRecommend scans the planned change
        - THEN: the planned change is skipped and not recommended
  milestone-advance-check:
    strength: MUST
    statement: >-
      milestoneAdvance(changeName) MUST read the change's planned-change id and milestone, scan all
      planned changes under that milestone, and if all are complete update the milestone status to
      complete
    scenarios:
      all-complete:
        - GIVEN: >-
            a change with milestone 0003-roadmap-workflow is archived and all other planned changes
            under that milestone have status complete
        - WHEN: milestoneAdvance is called with the change name
        - THEN: >-
            the milestone YAML status is updated to complete and INDEX.yaml is regenerated via
            roadmap-sync
  milestone-advance-incomplete-skip:
    strength: MUST
    statement: >-
      milestoneAdvance(changeName) MUST NOT change milestone status if any planned change under the
      milestone has a status other than complete
    scenarios:
      incomplete-milestone:
        - GIVEN: >-
            a change with milestone 0003-roadmap-workflow is archived but at least one other planned
            change under that milestone has status planned or active
        - WHEN: milestoneAdvance is called with the change name
        - THEN: the milestone status is not changed and no roadmap-sync is performed
  cancel-state-guard:
    strength: MUST
    statement: >-
      cancelChange MUST reject cancellation of changes not in proposed or applied state by returning
      the requireState error
    scenarios:
      reject-canceled-state:
        - GIVEN: a change already in canceled state
        - WHEN: cancelChange is called
        - THEN: the function returns an error string from requireState without attempting a transition
  cancel-transition:
    strength: MUST
    statement: >-
      cancelChange MUST call attemptTransition(changeName, 'canceled') for changes in proposed or
      applied state
    scenarios:
      valid-cancel-proposed:
        - GIVEN: a change in proposed state
        - WHEN: cancelChange is called
        - THEN: the change status is transitioned to canceled in proposal.yaml
  cancel-directory-removal:
    strength: SHOULD
    statement: >-
      cancelChange SHOULD remove the change directory when removeDir is true and the transition
      succeeds
    scenarios:
      directory-removed:
        - GIVEN: a change in proposed state and removeDir is true
        - WHEN: cancelChange is called
        - THEN: >-
            the .strict-spec-driven/changes/<name> directory is removed after the state transition
            completes
  propose-scaffold:
    strength: MUST
    statement: >-
      The propose tool MUST call invokeStrict('propose', { changeName, description }) and validate
      that the change directory and proposal.yaml exist after invocation
    scenarios:
      propose-happy-path:
        - GIVEN: a valid change name and free-text description
        - WHEN: propose({ changeName, description }) is called
        - THEN: >-
            invokeStrict is called with the correct subcommand and args, and the function returns {
            ok: true } if the scaffold exists
  propose-duplicate-rejection:
    strength: MUST
    statement: >-
      The propose tool MUST return an error if a change directory with the same name already exists
      under .strict-spec-driven/changes/
    scenarios:
      duplicate-name:
        - GIVEN: a change name matching an existing directory in .strict-spec-driven/changes/
        - WHEN: propose({ changeName, description }) is called
        - THEN: >-
            the function returns an error indicating the change already exists and suggests
            /strict-modify or /strict-cancel
  propose-tool-registration:
    strength: MUST
    statement: >-
      The strict_propose tool MUST be registered as a dispatchable agent tool with
      requiresChangeName=false and no state guard
    scenarios:
      tool-registered:
        - GIVEN: the strict tool registry is initialized
        - WHEN: registerStrictTools is called
        - THEN: >-
            a tool named strict_propose is available with parallelSafe=false and no required
            changeName parameter
  freeform-variant-detection:
    strength: MUST
    statement: >-
      The auto-pipeline tool MUST detect the freeform variant when a description argument is
      provided and run propose->apply->verify->review->archive->ship instead of the roadmap-driven
      recommend->apply->verify->review->archive->ship sequence.
    scenarios:
      freeform-with-description:
        - GIVEN: the strict_auto_pipeline tool is called with a description argument and a changeName
        - WHEN: the tool handler executes
        - THEN: >-
            runFreeformPipeline is called which runs propose first using the description, then
            continues with apply through ship using the same gate-check logic as the roadmap variant
  freeform-propose-first:
    strength: MUST
    statement: >-
      runFreeformPipeline MUST call the propose function with the provided description and
      changeName before any other pipeline step, and return a failure result if the propose step
      fails.
    scenarios:
      propose-fails:
        - GIVEN: runFreeformPipeline is called with a description and changeName
        - WHEN: the propose step fails
        - THEN: >-
            the pipeline returns a failed StepResult for the propose step with no further steps
            executed
  freeform-gate-checks:
    strength: MUST
    statement: >-
      runFreeformPipeline MUST run the same gate-check logic between steps as runAutoPipeline,
      including verifyCommand execution and roadmap-sync after archive.
    scenarios:
      gate-check-parity:
        - GIVEN: runFreeformPipeline is executing steps after propose
        - WHEN: a gate check fails at any step
        - THEN: the pipeline returns a failed StepResult and does not continue to subsequent steps
  modify-state-guard:
    strength: MUST
    statement: >-
      modifyChange MUST reject modifications to changes not in proposed or applied state by
      returning the requireState error
    scenarios:
      reject-verified-state:
        - GIVEN: a change in verified state
        - WHEN: modifyChange is called
        - THEN: the function returns an error string from requireState without modifying any artifacts
  modify-read-current-scope:
    strength: MUST
    statement: >-
      modifyChange MUST read and return the current scope from proposal.yaml before applying
      modifications
    scenarios:
      show-current-scope:
        - GIVEN: a change in proposed state with existing proposal.yaml
        - WHEN: modifyChange is called
        - THEN: the function returns a scope summary including the current what, why, in, and out fields
  modify-requires-confirmation:
    strength: MUST
    statement: >-
      modifyChange MUST NOT write to proposal.yaml or design.yaml unless the confirm parameter is
      true
    scenarios:
      no-confirm-rejects:
        - GIVEN: a change in proposed state
        - WHEN: modifyChange is called with confirm false or absent
        - THEN: >-
            the function returns an error indicating confirmation is required and no files are
            modified
  modify-applied-warning:
    strength: SHOULD
    statement: >-
      modifyChange SHOULD include a warning field in its result when the change was in applied
      state, indicating that re-apply may be needed to reflect the modifications
    scenarios:
      applied-state-warning:
        - GIVEN: a change in applied state
        - WHEN: modifyChange is called with confirm true
        - THEN: the result includes a warning string indicating re-apply may be needed
  modify-tool-registration:
    strength: MUST
    statement: >-
      The strict_modify tool MUST be registered as a dispatchable agent tool with
      requiresChangeName=true and state guard for proposed and applied states
    scenarios:
      tool-registered:
        - GIVEN: the strict tool registry is initialized
        - WHEN: registerStrictTools is called
        - THEN: >-
            a tool named strict_modify is available with parallelSafe=false and changeName as a
            required parameter
  e2e-freeform-pipeline:
    strength: MUST
    statement: >-
      An E2E test MUST exercise the complete free-form lifecycle (init, propose, generate, apply,
      modify, verify, review, archive, ship) against a fixture project and assert correct state
      transitions, file existence, and directory cleanup at each step
    scenarios:
      full-lifecycle:
        - GIVEN: a fixture project with an empty .strict-spec-driven/ directory
        - WHEN: the E2E test runs the free-form pipeline from propose through ship
        - THEN: >-
            each state transition succeeds, the corresponding artifacts exist, and the final state
            is shipped
  e2e-cancel-cleanup:
    strength: MUST
    statement: >-
      An E2E test MUST verify that cancel on a second proposed change transitions state to canceled
      and removes the change directory when removeDir is true
    scenarios:
      cancel-cleanup:
        - GIVEN: a second change in proposed state
        - WHEN: cancelChange is called with removeDir true
        - THEN: the change state transitions to canceled and the change directory is removed
mapping:
  implementation:
    - src/strict/lifecycle.ts
  tests:
    - tests/strict-lifecycle.test.ts

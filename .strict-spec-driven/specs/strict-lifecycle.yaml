schema: strict-spec-driven/spec/v1
schema_version: 1
artifact_type: main_spec
spec:
  id: strict-lifecycle
  title: Strict Change Lifecycle
requirements:
  valid-transitions:
    strength: MUST
    statement: >-
      ChangeLifecycle MUST allow only the defined valid transitions: proposed->applied,
      proposed->canceled, applied->verified, verified->reviewed, reviewed->archived,
      archived->shipped.
    scenarios:
      valid-forward:
        - GIVEN: a change in proposed state
        - WHEN: attemptTransition('proposed', 'applied') is called
        - THEN: the state is written to proposal.yaml change.status as applied and no error is thrown
  invalid-transition-rejection:
    strength: MUST
    statement: >-
      ChangeLifecycle MUST throw a descriptive error when attemptTransition is called with an
      invalid (from, to) pair that is not in the transition map.
    scenarios:
      invalid-transition:
        - GIVEN: a change in applied state
        - WHEN: attemptTransition('applied', 'proposed') is called
        - THEN: an error is thrown describing the invalid transition and the state is not changed
  terminal-state-immutable:
    strength: MUST
    statement: >-
      ChangeLifecycle MUST reject all transition attempts from terminal states (shipped, canceled)
      by throwing a descriptive error.
    scenarios:
      terminal-rejection:
        - GIVEN: a change in shipped state
        - WHEN: attemptTransition('shipped', 'proposed') is called
        - THEN: an error is thrown indicating shipped is a terminal state
  read-current-state:
    strength: MUST
    statement: >-
      ChangeLifecycle.readCurrentState(changeName) MUST parse
      .strict-spec-driven/changes/<name>/proposal.yaml change.status and return the typed
      ChangeState value.
    scenarios:
      read-happy-path:
        - GIVEN: 'a change directory with a proposal.yaml containing change.status: applied'
        - WHEN: readCurrentState('my-change') is called
        - THEN: the value 'applied' is returned as a typed ChangeState
  require-state-guard:
    strength: MUST
    statement: >-
      requireState(changeName, ...requiredStates) MUST read the current change state via
      ChangeLifecycle.readCurrentState and return an error string if the state does not match any of
      the required states, or undefined if the state is valid
    scenarios:
      state-mismatch:
        - GIVEN: a change named my-change is in proposed state
        - WHEN: requireState('my-change', 'applied') is called
        - THEN: an error string describing the mismatch is returned and the tool does not execute
  multi-state-guard:
    strength: MUST
    statement: >-
      requireState(changeName, ...requiredStates) MUST accept multiple required states and return
      undefined only if the current state matches at least one of them
    scenarios:
      multi-state-match:
        - GIVEN: a change named my-change is in applied state
        - WHEN: requireState('my-change', 'proposed', 'applied') is called
        - THEN: undefined is returned indicating the guard passed
  tool-dispatch-guarded:
    strength: MUST
    statement: >-
      Each strict tool dispatch handler MUST call requireState before invoking the CLI subcommand
      and return the error string as the tool result if the guard rejects the call
    scenarios:
      guarded-tool-call:
        - GIVEN: a change named my-change is in proposed state
        - WHEN: strict_verify tool is invoked with changeName my-change
        - THEN: the tool returns the guard error string without invoking the verify CLI subcommand
mapping:
  implementation:
    - src/strict/lifecycle.ts
  tests:
    - tests/strict-lifecycle.test.ts

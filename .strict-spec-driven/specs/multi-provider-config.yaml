schema: strict-spec-driven/spec/v1
schema_version: 1
artifact_type: main_spec
spec:
  id: multi-provider-config
  title: Multi-Provider Configuration
requirements:
  provider-field:
    strength: MUST
    statement: >-
      ReasonixConfig MUST include a provider field accepting 'deepseek' or 'glm', defaulting to
      'deepseek'
    scenarios:
      provider-default:
        - GIVEN: a config.json with no provider field
        - WHEN: readConfig() is called
        - THEN: the returned config has provider set to 'deepseek'
  glm-config-section:
    strength: MUST
    statement: ReasonixConfig MUST include a glm section with optional apiKey and baseUrl fields
    scenarios:
      glm-section-present:
        - GIVEN: a config.json with a glm section containing apiKey and baseUrl
        - WHEN: readConfig() is called
        - THEN: the returned config has glm.apiKey and glm.baseUrl populated
  active-provider-resolution:
    strength: MUST
    statement: >-
      loadActiveProvider() MUST resolve via REASONIX_PROVIDER env var, then config.json provider
      field, then 'deepseek' default
    scenarios:
      env-override:
        - GIVEN: REASONIX_PROVIDER is set to 'glm'
        - WHEN: loadActiveProvider() is called
        - THEN: '''glm'' is returned regardless of config.json value'
  glm-api-key-resolution:
    strength: MUST
    statement: >-
      GLM API key MUST resolve from ZHIPU_API_KEY env var first, then config.json glm.apiKey, then
      throw
    scenarios:
      glm-env-key:
        - GIVEN: ZHIPU_API_KEY env var is set
        - WHEN: the GLM provider API key is resolved
        - THEN: the ZHIPU_API_KEY value is returned
  glm-base-url-resolution:
    strength: MUST
    statement: >-
      GLM base URL MUST resolve from ZHIPU_BASE_URL env var first, then config.json glm.baseUrl,
      then undefined
    scenarios:
      glm-env-base-url:
        - GIVEN: ZHIPU_BASE_URL env var is set
        - WHEN: the GLM provider base URL is resolved
        - THEN: the ZHIPU_BASE_URL value is returned
      glm-config-base-url:
        - GIVEN: ZHIPU_BASE_URL is not set and config.json has glm.baseUrl
        - WHEN: the GLM provider base URL is resolved
        - THEN: the config.json glm.baseUrl value is returned
      glm-no-base-url:
        - GIVEN: neither ZHIPU_BASE_URL nor config.json glm.baseUrl is set
        - WHEN: the GLM provider base URL is resolved
        - THEN: undefined is returned without throwing
  model-to-provider:
    strength: MUST
    statement: >-
      modelToProvider(modelId) MUST map 'deepseek-*' to 'deepseek', 'glm-*' to 'glm', and unknown
      prefixes to the active provider. An optional activeProvider parameter MAY override the
      resolved active provider for unknown prefixes.
    scenarios:
      deepseek-prefix:
        - GIVEN: modelId is 'deepseek-v4-pro'
        - WHEN: modelToProvider('deepseek-v4-pro') is called
        - THEN: '''deepseek'' is returned'
      explicit-active-provider:
        - GIVEN: modelId is 'unknown-model' and activeProvider is 'glm'
        - WHEN: modelToProvider('unknown-model', 'glm') is called
        - THEN: '''glm'' is returned'
  backward-compat:
    strength: MUST
    statement: >-
      DEEPSEEK_API_KEY, DEEPSEEK_BASE_URL, DEEPSEEK_API_BASE_URL MUST remain as backward-compatible
      aliases with no behavioral change
    scenarios:
      existing-env-vars:
        - GIVEN: DEEPSEEK_API_KEY is set and no provider is configured
        - WHEN: loadApiKey() is called
        - THEN: the DEEPSEEK_API_KEY value is returned as before
  provider-registry-factory:
    strength: MUST
    statement: >-
      ProviderRegistry MUST map a provider ID string to a factory function that produces a
      ModelClient-typed instance
    scenarios:
      register-and-resolve:
        - GIVEN: a provider 'deepseek' is registered with a factory
        - WHEN: resolveModelClient('deepseek') is called
        - THEN: a ModelClient instance from that factory is returned
  model-validation:
    strength: MUST
    statement: >-
      Each registered provider MUST declare its supported model IDs and resolveModelClient() MUST
      throw on unknown models
    scenarios:
      unknown-model-throws:
        - GIVEN: provider 'glm' is registered with models ['glm-4', 'glm-4-flash']
        - WHEN: resolveModelClient('unknown-model') is called with active provider 'glm'
        - THEN: an error is thrown indicating the model is not supported
  resolve-defaults-to-active:
    strength: MUST
    statement: >-
      resolveModelClient() with no explicit provider MUST use the active provider resolved from
      config
    scenarios:
      default-provider-resolution:
        - GIVEN: config has provider set to 'deepseek'
        - WHEN: resolveModelClient() is called with no provider argument
        - THEN: a DeepSeekClient-typed ModelClient is returned
  port-chat-stream:
    strength: MUST
    statement: >-
      ModelClient port MUST define chat() and stream() methods matching current DeepSeekClient
      signatures, plus provider capability metadata (supportsThinking, supportsReasoningContent)
    scenarios:
      port-has-capability-flags:
        - GIVEN: a ModelClient implementation for deepseek
        - WHEN: client.capabilities is accessed
        - THEN: supportsThinking and supportsReasoningContent are boolean
  openai-compat-client:
    strength: MUST
    statement: >-
      OpenAICompatClient MUST provide a generic /chat/completions HTTP client with chat() and
      stream() methods, Bearer token auth, configurable retry, timeout, SSE streaming, standard
      delta parsing, usage accumulation, and structured error handling
    scenarios:
      openai-compat-chat:
        - GIVEN: an OpenAICompatClient instance with valid baseUrl and apiKey
        - WHEN: chat() is called with a model and messages
        - THEN: a POST to baseUrl/chat/completions returns a parsed ChatResponse
      openai-compat-stream:
        - GIVEN: an OpenAICompatClient instance with valid baseUrl and apiKey
        - WHEN: stream() is called with a model and messages
        - THEN: SSE chunks are parsed into StreamChunk objects until [DONE]
mapping:
  implementation:
    - src/config.ts
  tests:
    - tests/config.test.ts

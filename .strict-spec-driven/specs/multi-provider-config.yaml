schema: strict-spec-driven/spec/v1
schema_version: 1
artifact_type: main_spec
spec:
  id: multi-provider-config
  title: Multi-Provider Configuration
requirements:
  provider-field:
    strength: MUST
    statement: >-
      DeepSeekSpecConfig MUST include a provider field accepting 'deepseek' or 'glm', defaulting to
      'deepseek'
    scenarios:
      provider-default-rename:
        - GIVEN: a config.json with no provider field
        - WHEN: readConfig() is called
        - THEN: the returned config has provider set to 'deepseek' (type is now DeepSeekSpecConfig)
  glm-config-section:
    strength: MUST
    statement: DeepSeekSpecConfig MUST include a glm section with optional apiKey and baseUrl fields
    scenarios:
      glm-section-rename:
        - GIVEN: a config.json with a glm section containing apiKey and baseUrl
        - WHEN: readConfig() is called
        - THEN: >-
            the returned config has glm.apiKey and glm.baseUrl populated (type is now
            DeepSeekSpecConfig)
  active-provider-resolution:
    strength: MUST
    statement: >-
      loadActiveProvider() MUST resolve via DSPEC_PROVIDER env var, then config.json provider field,
      then 'deepseek' default
    scenarios:
      env-override:
        - GIVEN: DSPEC_PROVIDER is set to 'glm'
        - WHEN: loadActiveProvider() is called
        - THEN: '''glm'' is returned regardless of config.json value'
  glm-api-key-resolution:
    strength: MUST
    statement: >-
      GLM API key MUST resolve from ZHIPU_API_KEY env var first, then config.json glm.apiKey, then
      throw
    scenarios:
      glm-env-key:
        - GIVEN: ZHIPU_API_KEY env var is set
        - WHEN: the GLM provider API key is resolved
        - THEN: the ZHIPU_API_KEY value is returned
  glm-base-url-resolution:
    strength: MUST
    statement: >-
      GLM base URL MUST resolve from ZHIPU_BASE_URL env var first, then config.json glm.baseUrl,
      then undefined
    scenarios:
      glm-env-base-url:
        - GIVEN: ZHIPU_BASE_URL env var is set
        - WHEN: the GLM provider base URL is resolved
        - THEN: the ZHIPU_BASE_URL value is returned
      glm-config-base-url:
        - GIVEN: ZHIPU_BASE_URL is not set and config.json has glm.baseUrl
        - WHEN: the GLM provider base URL is resolved
        - THEN: the config.json glm.baseUrl value is returned
      glm-no-base-url:
        - GIVEN: neither ZHIPU_BASE_URL nor config.json glm.baseUrl is set
        - WHEN: the GLM provider base URL is resolved
        - THEN: undefined is returned without throwing
  model-to-provider:
    strength: MUST
    statement: >-
      modelToProvider(modelId) MUST map 'deepseek-*' to 'deepseek', 'glm-*' to 'glm', and unknown
      prefixes to the active provider. An optional activeProvider parameter MAY override the
      resolved active provider for unknown prefixes.
    scenarios:
      deepseek-prefix:
        - GIVEN: modelId is 'deepseek-v4-pro'
        - WHEN: modelToProvider('deepseek-v4-pro') is called
        - THEN: '''deepseek'' is returned'
      explicit-active-provider:
        - GIVEN: modelId is 'unknown-model' and activeProvider is 'glm'
        - WHEN: modelToProvider('unknown-model', 'glm') is called
        - THEN: '''glm'' is returned'
  backward-compat:
    strength: MUST
    statement: >-
      DEEPSEEK_API_KEY, DEEPSEEK_BASE_URL, DEEPSEEK_API_BASE_URL MUST remain as backward-compatible
      aliases with no behavioral change
    scenarios:
      existing-env-vars:
        - GIVEN: DEEPSEEK_API_KEY is set and no provider is configured
        - WHEN: loadApiKey() is called
        - THEN: the DEEPSEEK_API_KEY value is returned as before
  provider-registry-factory:
    strength: MUST
    statement: >-
      ProviderRegistry integration tests MUST validate DSPEC_PROVIDER env resolution, config.json
      fallback, default-to-deepseek, modelToProvider mapping, and capability flags for both
      providers
    scenarios:
      env-override-resolution:
        - GIVEN: DSPEC_PROVIDER is set to 'glm'
        - WHEN: the provider registry resolves the active provider
        - THEN: GLMClient is returned
  model-validation:
    strength: MUST
    statement: >-
      Each registered provider MUST declare its supported model IDs and resolveModelClient() MUST
      throw on unknown models
    scenarios:
      unknown-model-throws:
        - GIVEN: provider 'glm' is registered with models ['glm-4', 'glm-4-flash']
        - WHEN: resolveModelClient('unknown-model') is called with active provider 'glm'
        - THEN: an error is thrown indicating the model is not supported
  resolve-defaults-to-active:
    strength: MUST
    statement: >-
      resolveModelClient() with no explicit provider MUST use the active provider resolved from
      config
    scenarios:
      default-provider-resolution:
        - GIVEN: config has provider set to 'deepseek'
        - WHEN: resolveModelClient() is called with no provider argument
        - THEN: a DeepSeekClient-typed ModelClient is returned
  port-chat-stream:
    strength: MUST
    statement: >-
      All call sites that currently import DeepSeekClient for the type MUST import and use the
      ModelClient provider port interface instead
    scenarios:
      call-sites-retyped:
        - GIVEN: the provider registry is initialized with active provider deepseek
        - WHEN: >-
            CacheFirstLoop, StreamModelOptions, and 6 non-streaming call sites resolve their client
            type
        - THEN: all client references are typed as ModelClient, not DeepSeekClient
  openai-compat-client:
    strength: MUST
    statement: >-
      OpenAICompatClient regression tests MUST verify DeepSeek streaming output is identical to
      pre-refactor behavior and the base class correctly handles standard OpenAI SSE format
    scenarios:
      deepseek-regression:
        - GIVEN: a DeepSeekClient subclass of OpenAICompatClient with recorded DeepSeek SSE fixtures
        - WHEN: stream() is called and fixtures are replayed
        - THEN: assembled output matches the pre-refactor DeepSeek streaming behavior exactly
  glm-adapter-class:
    strength: MUST
    statement: >-
      GLMClient integration tests MUST validate streaming chat, tool-call invocation, multi-turn
      tool-use, parallel tool calls, stop reasons, empty content, long response assembly, Bearer
      auth headers, error response handling (401/429/context-length/malformed JSON), usage tracking,
      and absence of thinking params
    scenarios:
      glm-streaming-chat:
        - GIVEN: >-
            a GLMClient with a valid API key and a pre-recorded SSE fixture for a basic chat
            response
        - WHEN: stream() is called and the fixture is replayed
        - THEN: content deltas are assembled into the complete response text
  glm-provider-registration:
    strength: MUST
    statement: >-
      GLM provider MUST be registered in ProviderRegistry with ID 'glm' and supported models
      glm-4.7, glm-5.1, glm-5-turbo
    scenarios:
      glm-registry-resolve:
        - GIVEN: ProviderRegistry with GLM registered
        - WHEN: resolve('glm') is called
        - THEN: a GLMClient instance is returned
      glm-registry-validate:
        - GIVEN: ProviderRegistry with GLM registered
        - WHEN: validateModel('glm', 'glm-5.1') is called
        - THEN: no error is thrown
  capability-guard-thinking:
    strength: MUST
    statement: >-
      thinkingModeForModel() MUST only be called when the active provider's supportsThinking
      capability is true; reasoning_content delta parsing MUST only occur when
      supportsReasoningContent is true
    scenarios:
      thinking-guarded-by-capability:
        - GIVEN: >-
            the active provider is GLM which has supportsThinking=false and
            supportsReasoningContent=false
        - WHEN: the agent loop processes a streaming response from GLM
        - THEN: >-
            no thinking parameters are sent in the request and no reasoning_content is parsed from
            the response
  dir-path-rename:
    strength: MUST
    statement: >-
      All file system path constants MUST use '.dspec' as the config directory name and 'DSPEC.md'
      as the memory file name
    scenarios:
      old-dir-not-referenced:
        - GIVEN: any source file in src/
        - WHEN: searched for the string '.reasonix'
        - THEN: zero matches are returned
  env-prefix-rename:
    strength: MUST
    statement: >-
      loadActiveProvider() MUST resolve via DSPEC_PROVIDER env var instead of REASONIX_PROVIDER.
      ProviderRegistry tests MUST validate DSPEC_PROVIDER env resolution.
    scenarios:
      dspec-provider-env:
        - GIVEN: DSPEC_PROVIDER is set to 'glm'
        - WHEN: loadActiveProvider() is called
        - THEN: '''glm'' is returned regardless of config.json value'
  brand-rename-i18n:
    strength: MUST
    statement: >-
      All i18n strings, CLI help text, and error messages MUST reference 'DeepSeek-Spec' instead of
      'Reasonix'
    scenarios:
      i18n-brand:
        - GIVEN: the CLI displays a version, welcome, or error message
        - WHEN: the i18n key is resolved to a user-facing string
        - THEN: the string contains 'DeepSeek-Spec' and contains no occurrence of 'Reasonix'
  brand-rename:
    strength: MUST
    statement: >-
      All MCP, ACP, and network source code references to 'reasonix' are replaced with DeepSeek-Spec
      naming
    scenarios:
      grep-clean:
        - GIVEN: dependency changes are applied
        - WHEN: grep -ri reasonix src/mcp/ src/acp/ src/net/ is executed
        - THEN: zero matches are returned
  real-llm-test-infra:
    strength: MUST
    statement: >-
      Real-LLM test infrastructure MUST provide readRealLlmConfig, hasRealLlmConfig, and
      createRealLlmClient helpers that read from tests/real-llm.config.json and auto-skip when
      absent.
    scenarios:
      config-absent-skip:
        - GIVEN: tests/real-llm.config.json does not exist
        - WHEN: hasRealLlmConfig() is called
        - THEN: returns false
      config-valid-read:
        - GIVEN: tests/real-llm.config.json exists with valid zhipuApiKey and model
        - WHEN: readRealLlmConfig() is called
        - THEN: returns { zhipuApiKey, model, baseUrl? }
  real-chat-test:
    strength: MUST
    statement: >-
      Real-LLM chat tests must auto-skip when tests/real-llm.config.json is absent and assert
      non-empty content, positive usage tokens, finishReason=stop, and multi-turn context recall
      against the live GLM-4.7 API
    scenarios:
      chat-skip-no-config:
        - GIVEN: tests/real-llm.config.json does not exist
        - WHEN: bun run test:real is executed
        - THEN: all chat tests are skipped
  real-stream-test:
    strength: MUST
    statement: >-
      Real-LLM stream tests must auto-skip when config is absent and assert contentDelta chunk
      assembly into full response, usage in a late chunk, and final finishReason against the live
      GLM-4.7 API
    scenarios:
      stream-skip-no-config:
        - GIVEN: tests/real-llm.config.json does not exist
        - WHEN: bun run test:real is executed
        - THEN: all stream tests are skipped
  real-error-test:
    strength: MUST
    statement: >-
      Real-LLM error tests must auto-skip when config is absent and assert that an invalid API key
      produces a rejection containing 401 or 403 against the live GLM-4.7 API
    scenarios:
      error-skip-no-config:
        - GIVEN: tests/real-llm.config.json does not exist
        - WHEN: bun run test:real is executed
        - THEN: all error tests are skipped
      error-invalid-key:
        - GIVEN: a valid real-llm config exists with a real baseUrl
        - WHEN: >-
            GLMClient is created with apiKey 'invalid.key123' and the real baseUrl, then a chat
            request is sent
        - THEN: the rejection message contains '401' or '403'
  real-tool-call-test:
    strength: MUST
    statement: >-
      Real-LLM tool call tests must auto-skip when config is absent and assert that a chat request
      with tools produces a non-empty toolCalls array with the correct function name and parsed
      arguments against the live GLM-4.7 API
    scenarios:
      tool-call-skip-no-config:
        - GIVEN: tests/real-llm.config.json does not exist
        - WHEN: bun run test:real is executed
        - THEN: all tool call tests are skipped
      tool-call-invoked:
        - GIVEN: >-
            a valid real-llm config and GLMClient, a messages array asking about Beijing weather
            with a get_weather tool definition
        - WHEN: client.chat is called with the tool
        - THEN: >-
            response.toolCalls is a non-empty array, toolCalls[0].function.name is 'get_weather',
            and parsed arguments contain a 'city' field with 'Beijing' or '北京'
  glm-key-validation:
    strength: MUST
    statement: >-
      validateGlmApiKey() MUST validate a GLM API key by sending GET /models to
      open.bigmodel.cn/api/paas/v4 with Bearer auth, returning ok/rejected/failed
    scenarios:
      glm-key-ok:
        - GIVEN: a valid GLM API key
        - WHEN: validateGlmApiKey() is called
        - THEN: 'returns {ok: true}'
      glm-key-rejected:
        - GIVEN: an invalid GLM API key
        - WHEN: validateGlmApiKey() is called and the endpoint returns 401
        - THEN: 'returns {ok: false, reason: ''rejected''}'
      glm-key-timeout:
        - GIVEN: a GLM API key and network timeout
        - WHEN: validateGlmApiKey() is called and the request times out
        - THEN: 'returns {ok: false, reason: ''failed'', message: ''...''}'
  mimo-adapter-class:
    strength: MUST
    statement: >-
      MimoClient MUST extend OpenAICompatClient and override authHeaders() to emit { 'api-key': key
      } instead of Authorization Bearer. Default base URL MUST be
      https://token-plan-cn.xiaomimimo.com/v1.
    scenarios:
      mimo-auth-header:
        - GIVEN: a MimoClient instance with a valid tp-xxxxx API key
        - WHEN: authHeaders() is called
        - THEN: >-
            the returned headers contain 'api-key' header with the key value, not Authorization
            Bearer
  mimo-provider-id:
    strength: MUST
    statement: >-
      ProviderId type MUST include 'mimo' alongside 'deepseek' and 'glm'. MimoProviderConfig MUST
      mirror GlmProviderConfig with optional apiKey and baseUrl fields.
    scenarios:
      mimo-in-provider-id:
        - GIVEN: ProviderId type definition
        - WHEN: a new provider is added
        - THEN: ProviderId accepts 'mimo' as a valid value
  openai-provider-id:
    strength: MUST
    statement: >-
      ProviderId type MUST include openai. OpenAICustomProviderConfig MUST provide optional apiKey,
      baseUrl, and models fields. The openai provider MUST resolve apiKey from OPENAI_API_KEY env
      then config, and baseUrl from OPENAI_BASE_URL env then config.
    scenarios:
      openai-env-key:
        - GIVEN: OPENAI_API_KEY env var is set and config.json has openai.baseUrl
        - WHEN: OpenAICustomClient is constructed
        - THEN: the env var apiKey and config baseUrl are used
mapping:
  implementation:
    - src/config.ts
    - src/adapters/model-glm.ts
    - src/adapters/model-openai-compat.ts
    - src/providers/registry.ts
    - src/client.ts
  tests:
    - tests/config.test.ts
    - tests/glm-adapter.test.ts
    - tests/model-openai-compat.test.ts
    - tests/provider-registry.test.ts

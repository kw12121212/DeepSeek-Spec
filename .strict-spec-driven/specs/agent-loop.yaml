schema: strict-spec-driven/spec/v1
schema_version: 1
artifact_type: main_spec
spec:
  id: agent-loop
  title: Core Agent Loop
requirements:
  streaming-response:
    strength: MUST
    statement: >-
      streamModelResponse MUST yield delta events for reasoning, content, and tool calls during
      streaming, and return a final result with assembled content, reasoning, tool calls, and usage.
    scenarios:
      stream-deltas:
        - GIVEN: a valid model client and conversation context
        - WHEN: streamModelResponse is called
        - THEN: >-
            LoopEvent deltas are yielded during streaming and the generator returns a
            StreamModelResult with assembled content and usage
      abort-propagation:
        - GIVEN: an AbortSignal is provided via options
        - WHEN: the signal is triggered during streaming
        - THEN: streaming stops and the generator completes without hanging
  tool-dispatch-chunking:
    strength: MUST
    statement: >-
      dispatchToolCallsChunked MUST batch tool calls into chunks respecting DSPEC_PARALLEL_MAX
      (default 3, max 16) and DSPEC_TOOL_DISPATCH (default "auto", "serial" for sequential).
    scenarios:
      parallel-chunking:
        - GIVEN: 5 tool calls and DSPEC_PARALLEL_MAX is 3
        - WHEN: dispatchToolCallsChunked is called
        - THEN: >-
            calls are dispatched in 2 chunks (3 + 2), each tool result is persisted, and events are
            yielded for each lifecycle stage
      serial-mode:
        - GIVEN: DSPEC_TOOL_DISPATCH is set to "serial"
        - WHEN: dispatchToolCallsChunked is called with multiple tool calls
        - THEN: all calls execute sequentially, one at a time
      tool-failure:
        - GIVEN: a tool call that throws an error
        - WHEN: it is dispatched
        - THEN: a structured error result is yielded and persisted without crashing the loop
  tool-call-pairing:
    strength: MUST
    statement: >-
      fixToolCallPairing MUST remove unpaired tool calls and stray tool results that would be
      rejected by the model API, returning the cleaned messages and counts of dropped items.
    scenarios:
      unpaired-removed:
        - GIVEN: messages with an assistant tool call but no matching tool result
        - WHEN: fixToolCallPairing is called
        - THEN: the unpaired tool call is removed and droppedAssistantCalls > 0
      stray-result-removed:
        - GIVEN: messages with a tool result but no preceding tool call
        - WHEN: fixToolCallPairing is called
        - THEN: the stray result is removed and droppedStrayTools > 0
  message-healing:
    strength: MUST
    statement: >-
      healLoadedMessages MUST shrink oversized tool results exceeding maxChars and return the healed
      messages with a healedCount.
    scenarios:
      oversize-shrunk:
        - GIVEN: tool results exceeding maxChars
        - WHEN: healLoadedMessages is called
        - THEN: >-
            oversized results are truncated, healedCount reflects how many were modified, and no
            result exceeds maxChars
  token-based-healing:
    strength: MUST
    statement: >-
      healLoadedMessagesByTokens MUST shrink oversized tool results exceeding maxTokens and return
      the healed messages with tokensSaved and charsSaved counts.
    scenarios:
      token-shrunk:
        - GIVEN: tool results exceeding maxTokens
        - WHEN: healLoadedMessagesByTokens is called
        - THEN: oversized results are truncated and tokensSaved reflects the token reduction achieved
  reasoning-stamping:
    strength: MUST
    statement: >-
      stampMissingReasoningForThinkingMode MUST add an empty reasoning_content field to assistant
      turns that lack it when the model is a thinking-mode model.
    scenarios:
      stamp-added:
        - GIVEN: an assistant message without reasoning_content and a thinking-mode model
        - WHEN: stampMissingReasoningForThinkingMode is called
        - THEN: 'the message gets reasoning_content: "" added and stampedCount > 0'
      non-thinking-skipped:
        - GIVEN: an assistant message without reasoning_content and a non-thinking model
        - WHEN: stampMissingReasoningForThinkingMode is called
        - THEN: the message is unchanged and stampedCount is 0
  reasoning-retention:
    strength: MUST
    statement: >-
      stripDroppableReasoningContent MUST remove reasoning_content from non-tool-call assistant
      turns before the last user message, preserving reasoning for tool-call turns required by the
      model API.
    scenarios:
      pre-user-pruned:
        - GIVEN: assistant turns with reasoning_content before the last user message
        - WHEN: stripDroppableReasoningContent is called
        - THEN: >-
            reasoning_content is removed from non-tool-call turns, tool-call turns are preserved,
            and prunedCount > 0
  thinking-mode-detection:
    strength: MUST
    statement: >-
      isThinkingModeModel MUST return true for model IDs containing "reasoner" or matching DeepSeek
      v4 thinking-capable models.
    scenarios:
      reasoner-model:
        - GIVEN: model ID "deepseek-reasoner"
        - WHEN: isThinkingModeForModel is called
        - THEN: true is returned
      non-thinking-model:
        - GIVEN: model ID "deepseek-v4-flash"
        - WHEN: isThinkingModeForModel is called
        - THEN: false is returned
  hallucinated-markup-stripping:
    strength: MUST
    statement: >-
      stripHallucinatedToolMarkup MUST remove DSML/function_calls XML tags from text that the model
      erroneously emits outside tool call blocks.
    scenarios:
      dsml-stripped:
        - GIVEN: text containing <|DSML|invoke>... tags
        - WHEN: stripHallucinatedToolMarkup is called
        - THEN: the DSML tags are removed from the output string
  default-yolo-mode:
    strength: MUST
    statement: >-
      When no editMode is set in config, the system MUST default to 'yolo' mode (auto-apply edits,
      allow all shell commands) rather than 'review' mode
    scenarios:
      fresh-install-default:
        - GIVEN: a fresh install with no config file and no editMode set
        - WHEN: loadEditMode() is called
        - THEN: it returns 'yolo'
  fuzzy-slash-autocomplete:
    strength: MUST
    statement: >-
      Slash command autocomplete MUST include fuzzy-matched commands alongside prefix matches when
      the input is 2 or more characters
    scenarios:
      fuzzy-fallback:
        - GIVEN: user types a slash command prefix of 2+ characters that has no prefix match
        - WHEN: the autocomplete suggestions are computed
        - THEN: fuzzy-matched commands are included, sorted by score, after any prefix matches
  first-run-default-config:
    strength: MUST
    statement: >-
      On first run when setupCompleted is absent, the system MUST write a default config with
      setupCompleted:true and print a non-blocking API key hint if no key is found in env or config
    scenarios:
      first-run-defaults:
        - GIVEN: a fresh install with no config file
        - WHEN: the CLI starts and setupCompleted is absent
        - THEN: >-
            default config is written with setupCompleted:true and a one-line hint is printed if no
            API key is found
  no-wizard-mode:
    strength: MUST
    statement: >-
      resolveBareCommandMode MUST always return 'code' and never return 'setup', regardless of
      first-run state
    scenarios:
      always-code-mode:
        - GIVEN: any startup state including first run
        - WHEN: resolveBareCommandMode is called
        - THEN: it returns 'code' without entering a wizard flow
  config-dir-path:
    strength: MUST
    statement: >-
      The config directory path MUST resolve to ~/.dspec/ for global config and .dspec/ for
      project-local config
    scenarios:
      global-config-path:
        - GIVEN: the agent initializes
        - WHEN: resolving the global config directory
        - THEN: the path ends with '.dspec'
  parallel-dispatch-rename:
    strength: MUST
    statement: >-
      dispatchToolCallsChunked MUST batch tool calls into chunks respecting DSPEC_PARALLEL_MAX and
      DSPEC_TOOL_DISPATCH instead of REASONIX_PARALLEL_MAX and REASONIX_TOOL_DISPATCH
    scenarios:
      dspec-parallel-max:
        - GIVEN: 5 tool calls and DSPEC_PARALLEL_MAX is 3
        - WHEN: dispatchToolCallsChunked processes them
        - THEN: calls are batched into chunks of 3
mapping:
  implementation:
    - src/loop/dispatch.ts
    - src/loop/healing.ts
    - src/loop/streaming.ts
    - src/loop/reasoning-retention.ts
    - src/loop/thinking.ts
  tests:
    - tests/loop.test.ts

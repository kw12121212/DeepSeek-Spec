schema: strict-spec-driven/spec/v1
schema_version: 1
artifact_type: main_spec
spec:
  id: dashboard-server
  title: Dashboard HTTP Server
requirements:
  startup-binding:
    strength: MUST
    statement: >-
      The dashboard server MUST bind to 127.0.0.1 on an ephemeral port (or configured port) and
      generate a 32-byte hex auth token on startup.
    scenarios:
      ephemeral-port:
        - GIVEN: no port is configured
        - WHEN: the server starts
        - THEN: it binds to 127.0.0.1 on an OS-assigned port and returns a token
  token-auth:
    strength: MUST
    statement: >-
      All API requests MUST be authenticated via token — read requests accept token via query
      parameter or X-Dspec-Token header; mutation requests (POST/DELETE/PUT) require header-only
      token for CSRF protection.
    scenarios:
      missing-token-rejected:
        - GIVEN: a running server with a generated token
        - WHEN: an API request is made without a token
        - THEN: the request is rejected with 401
      mutation-requires-header:
        - GIVEN: a running server
        - WHEN: a POST request sends the token only via query parameter
        - THEN: the request is rejected with 401
      read-allows-query:
        - GIVEN: a running server
        - WHEN: a GET request sends the token via query parameter
        - THEN: the request is accepted
  constant-time-compare:
    strength: MUST
    statement: Token comparison MUST use constant-time comparison to prevent timing attacks.
    scenarios:
      timing-safe:
        - GIVEN: a valid token and an invalid token of the same length
        - WHEN: both are compared against the server token
        - THEN: comparison time does not leak which character differs
  spa-serving:
    strength: MUST
    statement: >-
      The server MUST serve the SPA from / and /index.html with token-gated access, and serve static
      assets from /assets/ without token gating.
    scenarios:
      root-serves-spa:
        - GIVEN: a running server with built assets
        - WHEN: GET / is requested with a valid token
        - THEN: the SPA HTML is returned
  sse-events:
    strength: MUST
    statement: >-
      The /api/events SSE endpoint MUST stream live events including assistant_delta, tool_start,
      modal_up/down, busy_change, and status updates to connected clients.
    scenarios:
      delta-stream:
        - GIVEN: a connected SSE client
        - WHEN: an assistant_delta event is emitted by the agent loop
        - THEN: the event is delivered to the client as an SSE data frame
  modal-system:
    strength: MUST
    statement: >-
      The modal API MUST support shell confirmations, path confirmations, choice dialogs, edit
      reviews, checkpoints, and picker interactions. Modal state MUST be resolved via the /api/modal
      endpoint.
    scenarios:
      shell-confirm:
        - GIVEN: a shell command requiring user confirmation
        - WHEN: the modal is created
        - THEN: a modal_up event is streamed and /api/modal accepts the resolution
  session-api:
    strength: MUST
    statement: >-
      The /api/sessions endpoint MUST list sessions, switch active sessions, and delete sessions.
      The /api/overview endpoint MUST return bundled state for the active session.
    scenarios:
      list-sessions:
        - GIVEN: 3 existing sessions
        - WHEN: GET /api/sessions is called
        - THEN: an array of 3 session summaries is returned
  submit-api:
    strength: MUST
    statement: >-
      The /api/submit endpoint MUST accept user prompts and inject them into the active agent
      session.
    scenarios:
      submit-prompt:
        - GIVEN: an active agent session
        - WHEN: POST /api/submit is called with a text prompt
        - THEN: the prompt is processed by the agent loop
  abort-api:
    strength: MUST
    statement: The /api/abort endpoint MUST abort the current agent turn.
    scenarios:
      abort-turn:
        - GIVEN: an agent loop mid-turn
        - WHEN: POST /api/abort is called
        - THEN: the current turn is cancelled via AbortSignal
  checkpoint-api:
    strength: MUST
    statement: The /api/checkpoints endpoints MUST create, list, show diffs for, and restore checkpoints.
    scenarios:
      create-and-restore:
        - GIVEN: a running session with file changes
        - WHEN: checkpoint-create is called then checkpoint-restore is called
        - THEN: files are reverted to the checkpoint state
  settings-api:
    strength: MUST
    statement: >-
      The /api/settings endpoint MUST read and update configuration including API key, model,
      budget, and skill preferences.
    scenarios:
      update-model:
        - GIVEN: an active session with model "deepseek-v4-flash"
        - WHEN: PUT /api/settings is called with model "deepseek-v4-pro"
        - THEN: the model is updated for subsequent turns
  files-api:
    strength: MUST
    statement: >-
      The /api/files, /api/browse, and /api/file-read endpoints MUST provide file listing, directory
      browsing, and file content reading.
    scenarios:
      read-file:
        - GIVEN: a file in the project directory
        - WHEN: GET /api/file-read is called with the file path
        - THEN: the file content is returned
  mcp-api:
    strength: MUST
    statement: The /api/mcp endpoint MUST list MCP server status and allow enabling/disabling servers.
    scenarios:
      list-mcp:
        - GIVEN: 2 configured MCP servers
        - WHEN: GET /api/mcp is called
        - THEN: server status (connected/disconnected) is returned for each
  usage-api:
    strength: MUST
    statement: The /api/usage endpoint MUST return cumulative token usage and cost metrics.
    scenarios:
      usage-metrics:
        - GIVEN: a session with 3 completed turns
        - WHEN: GET /api/usage is called
        - THEN: cumulative tokens and cost are returned
  context-update:
    strength: MUST
    statement: >-
      The server MUST support live context updates (agent loop, session, tools) without rebinding
      the port.
    scenarios:
      swap-session:
        - GIVEN: a running server with session A active
        - WHEN: the context is updated to session B
        - THEN: subsequent API calls operate on session B without port change
  non-loopback-warning:
    strength: SHOULD
    statement: The server SHOULD log a security warning when binding to a non-loopback address.
    scenarios:
      public-bind-warns:
        - GIVEN: a configured host of 0.0.0.0
        - WHEN: the server starts
        - THEN: a warning about non-loopback binding is logged
  scheduler-status-endpoint:
    strength: MUST
    statement: >-
      GET /api/scheduler/status MUST return { tasks: ScheduledTask[], enabledCount: number, running:
      boolean, nextRun: string | null } with tasks including name, cron, enabled, lastRun, and
      nextRun.
    scenarios:
      status-response:
        - GIVEN: A running dashboard server with 3 scheduled tasks (2 enabled)
        - WHEN: GET /api/scheduler/status is called with valid auth
        - THEN: >-
            Response contains 3 tasks, enabledCount=2, running=true, and nextRun as ISO string or
            null
  scheduler-history-endpoint:
    strength: MUST
    statement: >-
      GET /api/scheduler/history MUST return { entries: HistoryEntry[] }. When taskId query param is
      provided, filter to that task. Default limit 20, max 100. Without taskId, return all tasks
      newest-first.
    scenarios:
      history-filtered:
        - GIVEN: A HistoryStore with entries for tasks abc123 and def456
        - WHEN: GET /api/scheduler/history?taskId=abc123&limit=10 is called with valid auth
        - THEN: Response contains only entries for task abc123, at most 10, newest-first
  scheduler-auth:
    strength: MUST
    statement: >-
      Scheduler API endpoints MUST follow the existing dashboard token-auth pattern — GET requests
      accept token via query parameter or X-Dspec-Token header.
    scenarios:
      auth-required:
        - GIVEN: A running dashboard server with auth enabled
        - WHEN: GET /api/scheduler/status is called without a token
        - THEN: Response is 401 Unauthorized
  e2e-spa-load:
    strength: MUST
    statement: >-
      The dashboard SPA MUST load and render the main layout when accessed via browser with a valid
      token.
    scenarios:
      e2e-spa-renders:
        - GIVEN: A running dashboard server with built assets
        - WHEN: A Playwright browser navigates to the dashboard URL with a valid token
        - THEN: The SPA HTML renders with the main layout container visible
  e2e-sse-streaming:
    strength: MUST
    statement: >-
      The /api/events SSE endpoint MUST stream live events including model.turn.started and
      model.delta when a prompt is submitted.
    scenarios:
      e2e-sse-live:
        - GIVEN: A running dashboard server with a connected SSE client and active agent session
        - WHEN: A prompt is submitted via /api/submit and the SSE connection is active
        - THEN: model.turn.started and model.delta events arrive within 30 seconds
  e2e-auth-enforcement:
    strength: MUST
    statement: >-
      Dashboard API endpoints MUST enforce token auth: reject requests without token (401), accept
      GET with query param token, accept requests with X-Dspec-Token header, and reject POST with
      query-param-only token (CSRF).
    scenarios:
      e2e-auth-matrix:
        - GIVEN: A running dashboard server with a generated token
        - WHEN: Requests are made with various token placement strategies
        - THEN: Auth enforcement matches the token-auth and mutation-requires-header requirements
  e2e-session-api:
    strength: MUST
    statement: >-
      GET /api/sessions MUST return a session array and GET /api/overview MUST return current
      session info.
    scenarios:
      e2e-session-list:
        - GIVEN: A running dashboard server with sessions
        - WHEN: GET /api/sessions and GET /api/overview are called with valid auth
        - THEN: A session array and current session info are returned
  e2e-scheduler-status:
    strength: MUST
    statement: >-
      GET /api/scheduler/status MUST return { tasks, enabledCount, running, nextRun } and the SPA
      must render the scheduler status section.
    scenarios:
      e2e-scheduler-render:
        - GIVEN: A running dashboard server
        - WHEN: GET /api/scheduler/status is called with valid auth and the SPA is viewed
        - THEN: >-
            Response contains tasks array, enabledCount, running flag, and nextRun; SPA renders
            scheduler status
mapping:
  implementation:
    - src/server/index.ts
    - src/server/router.ts
    - src/server/context.ts
    - src/server/router.ts
  tests:
    - tests/server-dashboard.test.ts
    - tests/dashboard-smoke.test.ts
    - tests/dashboard-host-and-token.test.ts
    - tests/dashboard-port-pin.test.ts
    - tests/dashboard-token-persistence.test.ts
    - tests/dashboard-session-url.test.ts
    - tests/dashboard-sessions-ops.test.ts
    - tests/dashboard-server-bridge-refresh.test.ts
    - tests/server-index-config.test.ts

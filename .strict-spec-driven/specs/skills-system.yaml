schema: strict-spec-driven/spec/v1
schema_version: 1
artifact_type: main_spec
spec:
  id: skills-system
  title: Skills System
requirements:
  load-builtin-skills:
    strength: MUST
    statement: >-
      The skills system MUST load built-in skills from the bundled skill definitions and register
      them in the tool registry.
    scenarios:
      builtins-available:
        - GIVEN: the skills system initializes
        - WHEN: skill loading completes
        - THEN: all built-in skills are registered and discoverable
  load-user-skills:
    strength: MUST
    statement: >-
      The skills system MUST load user skills from .agents/skills as the primary directory and
      .claude/skills as fallback; .dspec/skills is no longer scanned.
    scenarios:
      agents-primary:
        - GIVEN: an .agents/skills directory with a skill.yaml file
        - WHEN: skills are loaded
        - THEN: the skill is parsed and available for execution
  frontmatter-parsing:
    strength: MUST
    statement: >-
      Skill frontmatter MUST include name, description, allowedTools, and mode (inline or subagent).
      Missing required fields MUST produce a clear error.
    scenarios:
      valid-frontmatter:
        - GIVEN: a skill file with name, description, tools, and mode
        - WHEN: the skill is loaded
        - THEN: the skill is registered with the specified metadata
      missing-name:
        - GIVEN: a skill file without a name field
        - WHEN: the skill is loaded
        - THEN: a descriptive error is returned
  inline-execution:
    strength: MUST
    statement: >-
      Skills in inline mode MUST execute the playbook in the current agent context with access to
      the specified allowedTools.
    scenarios:
      inline-run:
        - GIVEN: an inline skill with allowedTools [read_file, grep]
        - WHEN: the skill is invoked
        - THEN: the playbook runs with only read_file and grep available
  subagent-execution:
    strength: MUST
    statement: >-
      Skills in subagent mode MUST spawn a child agent to execute the playbook with the specified
      system prompt and tools.
    scenarios:
      subagent-run:
        - GIVEN: a subagent skill with a custom system prompt
        - WHEN: the skill is invoked
        - THEN: a child agent is spawned with the custom prompt and specified tools
  skill-index-generation:
    strength: MUST
    statement: >-
      The skills system MUST generate a skills index describing available skills for inclusion in
      the model context.
    scenarios:
      index-contents:
        - GIVEN: 5 loaded skills
        - WHEN: the skills index is generated
        - THEN: the index includes name, description, and invocation syntax for each skill
  install-skill:
    strength: MUST
    statement: >-
      The install mechanism MUST write new skills to .agents/skills (project or global scope)
      instead of .dspec/skills.
    scenarios:
      install-agents-dir:
        - GIVEN: a skill definition with name and playbook
        - WHEN: install is called with project scope
        - THEN: a skill file is created in .agents/skills/ with frontmatter
  builtin-skill-slash-commands:
    strength: MUST
    statement: >-
      All builtin skills MUST be registered as top-level slash commands in SLASH_COMMANDS and
      dispatchable via handleSlash.
    scenarios:
      explore-command:
        - GIVEN: a user typing /explore in the TUI
        - WHEN: the slash dispatcher receives the command
        - THEN: >-
            it resolves to the explore builtin skill and returns the skill body as a resubmit
            payload
      research-command:
        - GIVEN: a user typing /research in the TUI
        - WHEN: the slash dispatcher receives the command
        - THEN: >-
            it resolves to the research builtin skill and returns the skill body as a resubmit
            payload
      review-command:
        - GIVEN: a user typing /review in the TUI
        - WHEN: the slash dispatcher receives the command
        - THEN: it resolves to the review builtin skill and returns the skill body as a resubmit payload
      security-review-command:
        - GIVEN: a user typing /security-review in the TUI
        - WHEN: the slash dispatcher receives the command
        - THEN: >-
            it resolves to the security-review builtin skill and returns the skill body as a
            resubmit payload
      test-command:
        - GIVEN: a user typing /test in the TUI
        - WHEN: the slash dispatcher receives the command
        - THEN: it resolves to the test builtin skill and returns the skill body as a resubmit payload
  generic-skill-handler:
    strength: MUST
    statement: >-
      The slash handler for builtin skills MUST use a shared makeSkillHandler factory that reads the
      skill from SkillStore and returns a resubmit payload.
    scenarios:
      shared-handler:
        - GIVEN: any builtin skill name
        - WHEN: the handler is invoked via slash dispatch
        - THEN: it reads the skill from SkillStore and returns { info, resubmit } with the skill body
  skill-dir-placeholder-resolution:
    strength: MUST
    statement: >-
      SkillStore.parse MUST replace all {{SKILL_DIR}} placeholders in the skill body with the parent
      directory of the skill file path (dirname of skill.path).
    scenarios:
      file-backed-skill:
        - GIVEN: >-
            a file-backed skill whose path is /home/user/.agents/skills/foo/SKILL.md and whose body
            contains {{SKILL_DIR}}/scripts/run.js
        - THEN: the returned Skill.body contains /home/user/.agents/skills/foo/scripts/run.js
      builtin-skill-skip:
        - GIVEN: a builtin skill whose path is the literal string (builtin)
        - THEN: the returned Skill.body is unchanged and no substitution is attempted
      multiple-occurrences:
        - GIVEN: a skill body containing {{SKILL_DIR}}/a.js and {{SKILL_DIR}}/b.js
        - THEN: both occurrences are replaced with the skill directory path
  builtin-priority:
    strength: MUST
    statement: >-
      SkillStore.list MUST register builtin skills first so they win over file-backed skills with
      the same name. File-backed skills only fill gaps where no builtin exists.
    scenarios:
      builtin-wins-over-user:
        - GIVEN: >-
            a user-installed skill named strict-roadmap-plan at
            ~/.agents/skills/strict-roadmap-plan/
        - WHEN: SkillStore.list is called
        - THEN: the returned skill has scope builtin, not global
      user-fills-gap:
        - GIVEN: a user-installed skill named my-custom-skill at ~/.agents/skills/my-custom-skill/
        - AND: no builtin skill named my-custom-skill exists
        - WHEN: SkillStore.list is called
        - THEN: the returned skill has scope global
  builtin-vendor-abs-path:
    strength: MUST
    statement: >-
      Builtin skill bodies that reference vendor/strict-spec-driven.js MUST have it resolved to an
      absolute path at module load time so the scripts work regardless of CWD.
    scenarios:
      abs-path-in-body:
        - GIVEN: a builtin skill whose body contains node vendor/strict-spec-driven.js
        - WHEN: the skill is loaded
        - THEN: the body contains an absolute path ending in vendor/strict-spec-driven.js
      works-from-any-cwd:
        - GIVEN: the CWD is the user home directory, not a project root
        - WHEN: the model executes the node command from the builtin skill body
        - THEN: the script is found and runs successfully
mapping:
  implementation:
    - src/skills.ts
  tests:
    - tests/skills.test.ts
    - tests/tools-skills.test.ts

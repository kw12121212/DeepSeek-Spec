schema: strict-spec-driven/spec/v1
schema_version: 1
artifact_type: main_spec
spec:
  id: embedded-assets
  title: Embedded Asset Registry
requirements:
  registry-must-resolve:
    strength: MUST
    statement: AssetRegistry MUST resolve a named asset to a Uint8Array in both Node and Bun compile contexts
    scenarios:
      node-resolution:
        - GIVEN: the runtime is Node (tsup build)
        - WHEN: AssetRegistry.get('tokenizer') is called
        - THEN: >-
            the registry reads data/deepseek-tokenizer.json.gz from disk and returns its contents as
            Uint8Array
  native-resolve:
    strength: MUST
    statement: >-
      AssetRegistry MUST resolve a named asset to a Uint8Array without filesystem access in compiled
      mode
    scenarios:
      native-resolution:
        - GIVEN: the runtime is a compiled Bun binary (process.isBun and IS_COMPILED)
        - WHEN: AssetRegistry.get('tokenizer') is called
        - THEN: the registry returns the embedded blob as Uint8Array without filesystem access
  asset-enumeration:
    strength: MUST
    statement: AssetRegistry MUST enumerate all registered asset names
    scenarios:
      list-assets:
        - GIVEN: assets have been registered
        - WHEN: AssetRegistry.list() is called
        - THEN: it returns an array of all registered asset name strings
  detect-native:
    strength: MUST
    statement: detectNative() MUST return true when running inside a compiled Bun binary
    scenarios:
      compiled-context:
        - GIVEN: process.isBun is true and process.execPath does not contain bun
        - WHEN: detectNative() is called
        - THEN: it returns true
  embed-flag:
    strength: MUST
    statement: >-
      build-native.mjs MUST accept --embed flag that pre-processes static assets into
      import-attribute modules before compilation
    scenarios:
      embed-flag-build:
        - GIVEN: dist/cli/index.js exists and static assets are present
        - WHEN: scripts/build-native.mjs --target linux-x64 --embed is executed
        - THEN: >-
            assets are bundled into the compiled binary and accessible via AssetRegistry without
            external files
  resolve-data-file:
    strength: MUST
    statement: >-
      resolveDataFile(relPath) MUST return an absolute path suitable for fs operations in Node mode,
      and throw in native mode where filesystem access is not available
    scenarios:
      node-data-file:
        - GIVEN: IS_NATIVE is false
        - WHEN: resolveDataFile('data/deepseek-tokenizer.json.gz') is called
        - THEN: an absolute path to the file on disk is returned
  unified-resolve:
    strength: MUST
    statement: >-
      resolveAsset(name) MUST return a Uint8Array using AssetRegistry in native mode and
      __dirname-based disk read in Node mode
    scenarios:
      native-resolve-asset:
        - GIVEN: IS_NATIVE is true and AssetRegistry contains the named asset
        - WHEN: resolveAsset('tokenizer') is called
        - THEN: the embedded blob is returned as Uint8Array without filesystem access
  node-fallback-resolve:
    strength: MUST
    statement: >-
      resolveAsset(name) MUST return a Uint8Array via disk read when IS_NATIVE is false, preserving
      existing __dirname-based resolution
    scenarios:
      node-resolve-asset:
        - GIVEN: IS_NATIVE is false
        - WHEN: resolveAsset('tokenizer') is called
        - THEN: >-
            the data file is read from disk using the existing candidate-path resolution and
            returned as Uint8Array
  smoke-tokenizer:
    strength: MUST
    statement: smoke-native.mjs MUST verify that the tokenizer asset loads without error in the native binary
    scenarios:
      tokenizer-check:
        - GIVEN: a compiled native binary with embedded assets
        - WHEN: the smoke test checks asset loading
        - THEN: the binary reports successful tokenizer load without error output
  brand-assets-naming:
    strength: MUST
    statement: Brand asset files under docs/brand/ MUST use dspec- prefix instead of reasonix- prefix
    scenarios:
      brand-asset-rename:
        - GIVEN: docs/brand/ directory exists with reasonix-prefixed files
        - WHEN: brand rename is complete
        - THEN: all files use dspec- prefix and README references updated paths
  brand-rename-dashboard:
    strength: MUST
    statement: Dashboard HTML meta tokens and visible text MUST use 'dspec-' prefix and 'DeepSeek-Spec' name
    scenarios:
      dashboard-brand:
        - GIVEN: the dashboard HTML is loaded
        - WHEN: meta tags and visible text are rendered
        - THEN: >-
            meta token names use 'dspec-' prefix and visible text says 'DeepSeek-Spec' with no
            occurrence of 'reasonix'
mapping:
  implementation:
    - src/cli/assets.ts
  tests:
    - tests/assets.test.ts

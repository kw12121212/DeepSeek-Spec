schema: strict-spec-driven/spec/v1
schema_version: 1
artifact_type: main_spec
spec:
  id: native-build-script
  title: Native Build Script
requirements:
  single-target:
    strength: MUST
    statement: >-
      build-native.mjs MUST accept --target <platform> and produce a standalone binary at
      dist/native/<platform>/reasonix[.exe]
    scenarios:
      happy-path:
        - GIVEN: dist/cli/index.js exists from a prior tsup build
        - WHEN: scripts/build-native.mjs --target linux-x64 is executed
        - THEN: a standalone binary is produced at dist/native/linux-x64/reasonix
  all-targets:
    strength: MUST
    statement: build-native.mjs MUST accept --all flag to build all 5 targets sequentially
    scenarios:
      all-flag:
        - GIVEN: dist/cli/index.js exists
        - WHEN: scripts/build-native.mjs --all is executed
        - THEN: >-
            binaries are produced for linux-x64, linux-arm64, darwin-x64, darwin-arm64, and
            windows-x64
  missing-dist:
    strength: MUST
    statement: build-native.mjs MUST exit with a clear error when dist/cli/index.js does not exist
    scenarios:
      no-tsup-output:
        - GIVEN: dist/cli/index.js does not exist
        - WHEN: scripts/build-native.mjs --target linux-x64 is executed
        - THEN: >-
            the script exits with a non-zero code and prints an error message instructing the user
            to run bun run build first
  tag-trigger:
    strength: MUST
    statement: The workflow MUST trigger on pushes to tags matching v*
    scenarios:
      tag-push-builds:
        - GIVEN: a tag matching v* is pushed to the repository
        - WHEN: the workflow runs
        - THEN: native binaries are built for all 5 targets and uploaded as release assets
  matrix-targets:
    strength: MUST
    statement: >-
      The workflow MUST use a matrix strategy building linux-x64, linux-arm64, darwin-x64,
      darwin-arm64, and windows-x64
    scenarios:
      matrix-coverage:
        - GIVEN: the workflow is triggered
        - WHEN: the matrix expands
        - THEN: one job runs per target on the appropriate OS runner
  sha256-checksums:
    strength: MUST
    statement: The workflow MUST produce a SHA256 checksums file alongside release assets
    scenarios:
      checksums-file:
        - GIVEN: all matrix build jobs complete successfully
        - WHEN: the release job runs
        - THEN: a checksums.txt file is generated and uploaded containing SHA256 hashes for each binary
  release-naming:
    strength: MUST
    statement: Release assets MUST follow naming convention reasonix-<version>-<target>[.exe]
    scenarios:
      naming-convention:
        - GIVEN: a binary is built for a target
        - WHEN: it is uploaded as a release asset
        - THEN: the filename matches reasonix-<tag-version>-<target> with .exe appended for windows-x64
mapping:
  implementation:
    - scripts/build-native.mjs
  tests:
    - tests/native-build.test.ts

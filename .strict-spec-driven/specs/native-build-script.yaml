schema: strict-spec-driven/spec/v1
schema_version: 1
artifact_type: main_spec
spec:
  id: native-build-script
  title: Native Build Script
requirements:
  single-target:
    strength: MUST
    statement: >-
      build-native.mjs MUST produce a standalone binary at dist/native/<platform>/dspec[.exe] (was
      reasonix)
    scenarios:
      rename-single-target:
        - GIVEN: dist/cli/index.js exists from a prior tsup build
        - WHEN: scripts/build-native.mjs --target linux-x64 is executed
        - THEN: a standalone binary is produced at dist/native/linux-x64/dspec
  all-targets:
    strength: MUST
    statement: build-native.mjs MUST accept --all flag to build all 5 targets sequentially
    scenarios:
      all-flag:
        - GIVEN: dist/cli/index.js exists
        - WHEN: scripts/build-native.mjs --all is executed
        - THEN: >-
            binaries are produced for linux-x64, linux-arm64, darwin-x64, darwin-arm64, and
            windows-x64
  missing-dist:
    strength: MUST
    statement: build-native.mjs MUST exit with a clear error when dist/cli/index.js does not exist
    scenarios:
      no-tsup-output:
        - GIVEN: dist/cli/index.js does not exist
        - WHEN: scripts/build-native.mjs --target linux-x64 is executed
        - THEN: >-
            the script exits with a non-zero code and prints an error message instructing the user
            to run bun run build first
  tag-trigger:
    strength: MUST
    statement: The workflow MUST trigger on pushes to tags matching v*
    scenarios:
      tag-push-builds:
        - GIVEN: a tag matching v* is pushed to the repository
        - WHEN: the workflow runs
        - THEN: native binaries are built for all 5 targets and uploaded as release assets
  matrix-targets:
    strength: MUST
    statement: >-
      The workflow MUST use a matrix strategy building linux-x64, linux-arm64, darwin-x64,
      darwin-arm64, and windows-x64
    scenarios:
      matrix-coverage:
        - GIVEN: the workflow is triggered
        - WHEN: the matrix expands
        - THEN: one job runs per target on the appropriate OS runner
  sha256-checksums:
    strength: MUST
    statement: The workflow MUST produce a SHA256 checksums file alongside release assets
    scenarios:
      checksums-file:
        - GIVEN: all matrix build jobs complete successfully
        - WHEN: the release job runs
        - THEN: a checksums.txt file is generated and uploaded containing SHA256 hashes for each binary
  release-naming:
    strength: MUST
    statement: Release assets MUST follow naming convention dspec-<version>-<target>[.exe] (was reasonix-...)
    scenarios:
      rename-release-naming:
        - GIVEN: a binary is built for a target
        - WHEN: it is uploaded as a release asset
        - THEN: the filename matches dspec-<tag-version>-<target> with .exe appended for windows-x64
  unix-local-install:
    strength: MUST
    statement: >-
      install.sh MUST copy the native binary from dist/native/<target>/dspec to ~/.local/bin (or
      --prefix) as dspec and make it executable
    scenarios:
      rename-unix-install:
        - GIVEN: a compiled binary exists at dist/native/linux-x64/dspec
        - WHEN: scripts/install.sh is run without arguments
        - THEN: the binary is copied to ~/.local/bin/dspec and is executable
  windows-local-install:
    strength: MUST
    statement: >-
      install.ps1 MUST copy the native binary from dist/native/windows-x64/dspec.exe to
      %USERPROFILE%\bin\dspec.exe and ensure the directory is in PATH
    scenarios:
      rename-windows-install:
        - GIVEN: a compiled binary exists at dist/native/windows-x64/dspec.exe
        - WHEN: install.ps1 is run
        - THEN: >-
            the binary is copied to %USERPROFILE%\bin\dspec.exe and %USERPROFILE%\bin is in the user
            PATH
  smoke-version:
    strength: MUST
    statement: >-
      smoke-native.mjs MUST run the native binary with --version and assert the output matches the
      version in package.json
    scenarios:
      version-check:
        - GIVEN: a compiled native binary exists at the expected path
        - WHEN: smoke-native.mjs is run
        - THEN: the binary --version output matches the version field read from package.json
  smoke-help:
    strength: MUST
    statement: smoke-native.mjs MUST run the native binary with --help and assert it exits with code 0
    scenarios:
      help-check:
        - GIVEN: a compiled native binary exists
        - WHEN: the binary is run with --help
        - THEN: the process exits with code 0
  brand-rename:
    strength: MUST
    statement: Benchmark source files use 'dspec' instead of 'reasonix' for RunMode and related identifiers
    scenarios:
      grep-clean:
        - GIVEN: dependency changes are applied
        - WHEN: grep -ri reasonix benchmarks/ --include='*.ts' is executed
        - THEN: zero matches are returned
mapping:
  implementation:
    - scripts/build-native.mjs
  tests:
    - tests/native-build.test.ts

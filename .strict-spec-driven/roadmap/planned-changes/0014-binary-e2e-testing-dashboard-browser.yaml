schema_version: 1
artifact_type: planned_change
schema_file: ../schemas/planned-change.yaml
planned_change:
  id: dashboard-browser-e2e
  milestone: 0014-binary-e2e-testing
status: complete
summary: |
  Dashboard browser E2E tests using Playwright to verify the SPA loads, SSE
  events stream live, session switching works, scheduler status page renders,
  and token auth enforces access control. Starts the binary with dashboard
  enabled (default behavior), parses the URL+token from pty output.
details: |
  Create tests/e2e/dashboard/ directory with:

  1. helper.ts:
     - startDashboard(): spawn "dspec chat" via node-pty (dashboard auto-starts
       by default in chat mode), parse the output for the pattern
       "/dashboard  →  http://127.0.0.1:PORT/?token=TOKEN", return
       { url, token, port, stop() }.
     - startDashboard(opts): optional --dashboard-port to pin port for
       deterministic testing.
     - stopDashboard(): send /exit to the pty and wait for process exit.
     - Uses node-pty because the dashboard URL is printed inside the Ink TUI
       output, not to raw stdout — need PTY to capture it.
     - Reads e2e.config.json for binaryPath, LLM credentials.
     - Uses createFixtureWorktree() for cwd (isolated project context).
     - Auto-skips when config or binary is missing.

  2. spa-load.test.ts:
     - Start dashboard via helper
     - Launch Playwright browser, navigate to URL with token
     - Assert SPA HTML renders: look for main layout container, sidebar, etc.
     - Close browser, stop dashboard

  3. sse-events.test.ts:
     - Start dashboard via helper
     - Connect to /api/events SSE endpoint via fetch/EventSource with token
     - POST a prompt via /api/submit with token in header
     - Assert model.turn.started event arrives within 30s
     - Assert at least one model.delta event arrives
     - Close connection, stop dashboard

  4. session-switch.test.ts:
     - Start dashboard via helper
     - GET /api/sessions with token — assert session list is returned (array)
     - GET /api/overview with token — assert current session info
     - Stop dashboard

  5. scheduler-status.test.ts:
     - Start dashboard via helper
     - GET /api/scheduler/status with token
     - Assert response structure: { tasks, enabledCount, running, nextRun }
     - Navigate to SPA dashboard page via Playwright
     - Assert scheduler status section renders
     - Close browser, stop dashboard

  6. auth-enforcement.test.ts:
     - Start dashboard via helper
     - Request /api/sessions without token — assert 401
     - GET /api/sessions with token via query param — assert 200
     - GET /api/sessions with token via X-Dspec-Token header — assert 200
     - POST /api/submit with token only in query param — assert 401 (CSRF)
     - POST /api/submit with token in header — assert 200 or appropriate
       response (may fail if no prompt body, but auth passes)
     - Stop dashboard

  Important: agent-browser is a Claude Code skill that cannot run inside
  vitest. Use Playwright directly as a devDependency. The agent-browser skill
  can be used separately for ad-hoc manual dashboard testing.

  Files to create:
  - tests/e2e/dashboard/helper.ts
  - tests/e2e/dashboard/spa-load.test.ts
  - tests/e2e/dashboard/sse-events.test.ts
  - tests/e2e/dashboard/session-switch.test.ts
  - tests/e2e/dashboard/scheduler-status.test.ts
  - tests/e2e/dashboard/auth-enforcement.test.ts

  Dependencies to add:
  - @playwright/test (devDependency)
  - node-pty (devDependency, shared with terminal-e2e)
depends_on:
  - shared-config

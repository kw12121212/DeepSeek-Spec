schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../schemas/planned-change.yaml
planned_change:
  id: system-prompts-strings
  milestone: 0009-brand-rename
status: complete
summary: |
  Update all system prompts, user-facing strings, i18n keys, dashboard HTML,
  and CLI help text from "Reasonix" to "DeepSeek-Spec".
details: |
  System prompts (src/loop.ts, src/agents.ts):
  - "You are Reasonix Code, a standalone coding assistant"
    -> "You are DeepSeek-Spec Code, a standalone coding assistant"
  - "You are a Reasonix subagent" -> "You are a DeepSeek-Spec subagent"
  - "REASONIX.md edits take effect without a restart"
    -> "DSPEC.md edits take effect without a restart"
  - "reasonix code" in hook cwd comment -> "dspec code"

  Version and startup output:
  - "reasonix ${VERSION}" -> "dspec ${VERSION}"

  i18n keys in EN.ts (13 occurrences, propagate to all 5 locales):
  - cli.version: "Print Reasonix version" -> "Print DeepSeek-Spec version"
  - cli.update: "Check for a newer Reasonix" -> "Check for a newer DeepSeek-Spec"
  - ui.welcomeTitle: "Welcome to Reasonix" -> "Welcome to DeepSeek-Spec"
  - ui.mcpTitle: "Which MCP servers should Reasonix wire up" -> "...DeepSeek-Spec..."
  - ui.tipEditBindings.topic: "Reasonix keys + mouse reference" -> "DeepSeek-Spec..."
  - skills.empty: "no skills found. Reasonix reads skills from:" -> "...DeepSeek-Spec..."
  - ui.banner: "Reasonix v{version}" -> "DeepSeek-Spec v{version}"
  - ui.platformWarning, ui.budgetExceeded, ui.rateLimit429,
    ui.deepSeekError, ui.serverError: all "Reasonix" -> "DeepSeek-Spec"

  Dashboard HTML (dashboard/index.html):
  - Meta tags: reasonix-token -> dspec-token, reasonix-mode -> dspec-mode
  - Page title if present

  CLI --help text and error messages:
  - All "Reasonix" brand references in help output
  - "Restart Reasonix to apply" -> "Restart DeepSeek-Spec to apply"
  - "Reasonix requires Node 22+" -> "DeepSeek-Spec requires Node 22+"

  Verification: grep -ri "reasonix" src/i18n/ src/loop.ts src/agents.ts
  dashboard/index.html returns zero matches.
depends_on:
  - package-identity

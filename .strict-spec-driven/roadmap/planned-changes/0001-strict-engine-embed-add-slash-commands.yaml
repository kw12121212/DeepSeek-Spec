schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../schemas/planned-change.yaml
planned_change:
  id: add-slash-commands
  milestone: 0001-strict-engine-embed
status: complete
summary: Add /strict-* slash commands to the Reasonix CLI with step-by-step dispatch
details: >-
  Add entries to SLASH_COMMANDS in src/cli/ui/slash/commands.ts under a new group 'strict'.
  Commands: /strict-init, /strict-propose, /strict-apply, /strict-verify, /strict-review,
  /strict-archive, /strict-ship, /strict-cancel, /strict-brainstorm, /strict-modify,
  /strict-roadmap-recommend, /strict-auto. Each dispatches to the corresponding built-in skill. Each
  accepts optional args (change name, description text). Slash autocomplete shows all /strict-*
  commands grouped under 'strict'.
depends_on:
  - register-builtin-skills

schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../schemas/planned-change.yaml
planned_change:
  id: cross-platform-ci
  milestone: 0006-native-executable
status: complete
summary: GitHub Actions workflow for cross-platform native builds and release artifacts
details: >-
  Create .github/workflows/build-native.yml. Trigger on tag push (v*). Use a matrix strategy for 5
  targets: linux-x64, linux-arm64, darwin-x64, darwin-arm64, windows-x64. Each job: checkout, setup
  bun, bun install, bun run build, bun scripts/build-native.mjs --target $TARGET. Upload resulting
  binary as GitHub Release asset with naming convention reasonix-<version>-<target>[.exe]. Include
  SHA256 checksums file. Use ubuntu-latest runners for linux targets and macos-latest for darwin
  targets. windows-latest for windows.
depends_on:
  - native-build-script

schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../schemas/planned-change.yaml
planned_change:
  id: wire-lifecycle-guards
  milestone: 0002-change-lifecycle
status: planned
summary: Wire lifecycle guards into each strict tool dispatch
details: >-
  Create src/strict/guard.ts with requireState(changeName, requiredState). Each strict tool calls it
  before execution: strict_apply requires proposed, strict_verify requires applied, strict_review
  requires verified, strict_archive requires reviewed, strict_ship requires archived, strict_cancel
  requires proposed or applied. Guard returns error message if state mismatches. Integrate into tool
  handlers from M1/wire-tool-registry.
depends_on:
  - lifecycle-module

schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../schemas/planned-change.yaml
planned_change:
  id: task-executor
  milestone: 0011-scheduled-tasks-core
status: planned
summary: |
  Implement the task executor that runs a scheduled task prompt through a headless agent session.
details: |
  src/scheduler/executor.ts:
  - TaskExecutor class:
    - constructor(options: { modelClient: ModelClient, toolHost: ToolHost })
    - execute(task: ScheduledTask): Promise<TaskExecutionResult>
  - TaskExecutionResult:
    { taskId: string, startedAt: string, finishedAt: string,
      status: 'success' | 'error', outputSnippet: string, duration: number }

  Execution flow:
  - Create a synthetic session in .dspec/scheduled-sessions/ (not user sessions)
  - Build messages: default system prompt (reuse from main loop, includes tool instructions)
    + user message (the task prompt)
  - Call CacheFirstLoop.run() for up to DSPEC_SCHEDULED_MAX_TURNS turns (default 10)
  - Collect the final assistant response as output
  - Return TaskExecutionResult (caller writes to history store, not executor)

  Isolation:
  - .dspec/scheduled-sessions/ directory, separate from user sessions
  - Auto-cleanup: keep only last 5 session files per task after each execution
  - Task sessions do not appear in /sessions list (filtered by path prefix)

  Error handling:
  - Agent loop throws -> catch, return status: 'error' with error message as snippet
  - Execution exceeds DSPEC_SCHEDULED_TIMEOUT_MS (default 300000 = 5min) -> abort, return error
  - Abort uses AbortController, passed to CacheFirstLoop options

  User-facing strings use t() from src/i18n/index.ts.

  tests/scheduler/executor.test.ts:
  - Successful execution returns status 'success' with non-empty snippet
  - Failed execution returns status 'error' with error message
  - Session isolation: no files written to user session directory
  - Timeout: execution exceeding limit is aborted
depends_on:
  - scheduler-store

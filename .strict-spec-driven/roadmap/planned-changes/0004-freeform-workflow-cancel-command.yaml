summary: Implement /strict-cancel to abort a change in proposed or applied state
details: >-
  Create src/strict/cancel.ts. Accepts change name. Validates change exists and is in proposed or
  applied state (reject if verified or later). Transitions to canceled state via ChangeLifecycle.
  Optionally removes change directory if user confirms. Reports canceled change. Wired as
  /strict-cancel slash command.

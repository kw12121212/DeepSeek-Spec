schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../schemas/planned-change.yaml
planned_change:
  id: error-handling
  milestone: 0010-real-llm-test
status: complete
summary: |
  Real integration test for invalid auth against the live GLM-4.7 API.
details: |
  All tests use describe.skipIf(!hasRealLlmConfig())() and set
  { timeout: 30_000 } per test.

  tests/real-llm/errors.test.ts:
  - "throws readable error on invalid API key":
    Create GLMClient with { apiKey: "invalid.key123", baseUrl: real config baseUrl }.
    Send a simple chat request.
    Assert: rejection message contains "401" or "403".

  Note: 429 (rate limit) and context-length tests are excluded because they
  waste API quota and are unreliable against a live endpoint. The existing
  fixture-based tests in tests/provider/glm.test.ts already cover these
  error paths with mocked responses.
depends_on:
  - config-and-vitest

schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../schemas/planned-change.yaml
planned_change:
  id: chat-and-stream
  milestone: 0010-real-llm-test
status: complete
summary: |
  Real integration tests for basic chat completion and SSE streaming
  against the live GLM-4.7 API.
details: |
  All tests use describe.skipIf(!hasRealLlmConfig())() and set
  { timeout: 30_000 } per test.

  tests/real-llm/chat.test.ts:
  - "returns non-empty content for a simple prompt":
    Send { model: "glm-4.7", messages: [{ role: "user", content: "Say hello in one word." }] }
    Assert: content is a non-empty string.
  - "includes usage with positive token counts":
    Same request. Assert: usage.promptTokens > 0, usage.completionTokens > 0.
  - "finishReason is stop":
    Same request. Assert: finishReason === "stop".
  - "multi-turn maintains context":
    Send two messages: user "My name is TestBot." then assistant responds,
    then user "What is my name?". Assert: response content contains
    "TestBot" (case-insensitive).

  tests/real-llm/stream.test.ts:
  - "streaming yields contentDelta chunks that assemble into full response":
    Stream a prompt. Collect all chunks with contentDelta.
    Assert: concatenated content is non-empty string.
  - "streaming includes usage in a late chunk":
    Same stream. Assert: at least one chunk has usage with positive tokens.
  - "final chunk has finishReason":
    Same stream. Assert: last chunk with finishReason exists.

  Helper function (shared in tests/real-llm/helpers/collect.ts):
  - collectStream(gen): AsyncGenerator<StreamChunk> -> StreamChunk[]
    Drains the generator into an array.
depends_on:
  - config-and-vitest

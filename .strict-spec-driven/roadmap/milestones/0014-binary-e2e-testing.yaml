schema: strict-spec-driven/roadmap-milestone/v2
schema_version: 2
artifact_type: roadmap_milestone
schema_file: ../schemas/roadmap-milestone.yaml
milestone:
  0014-binary-e2e-testing:
    title: 'M14: Binary E2E Testing — Real Terminal, Real LLM, Real Dashboard'
goal: |
  Validate the built binary end-to-end with three complementary black-box test
  layers against a controlled git fixture project: (1) terminal E2E using
  node-pty to drive interactive chat/code mode with a real LLM, verifying
  prompts get responses and tools execute correctly on the fixture; (2) CLI
  smoke tests covering non-interactive commands (version, --help, doctor, run)
  against the built binary via child_process.spawn; (3) dashboard browser E2E
  using Playwright to verify the SPA loads, SSE events stream, sessions render,
  scheduler status page works, and token auth enforces access control. All tests
  consume the JS bundle (node dist/cli/index.js) or native binary — never the
  tsx dev entry. Tests auto-skip when real-LLM config or binary is absent so CI
  stays green. A git fixture project under tests/e2e/fixtures/sample-project/
  provides a controlled, reproducible project context for code-mode and tool
  tests without polluting the main repository.
scope:
  in:
    - Create tests/e2e/ directory with shared config + three test suites
    - >-
      Git fixture: tests/e2e/fixtures/sample-project/ with package.json, src/, README.md,
      tsconfig.json, .git — committed and checked into the repo
    - >-
      Fixture isolation: createFixtureWorktree() copies fixture to a temp directory per test,
      cleanup() removes it after — zero impact on main repo
    - 'Shared config: e2e.config.json (gitignored) for binary path, LLM credentials, timeouts'
    - >-
      Terminal E2E: node-pty spawns chat/code mode with cwd=fixture worktree, asserts LLM responses
      and tool execution
    - 'CLI smoke: child_process.spawn runs non-interactive commands, asserts exit codes and output'
    - 'Dashboard browser E2E: Playwright verifies SPA, SSE, sessions, scheduler, auth'
    - Add vitest exclude for tests/e2e/** so default bun run test stays clean
    - Add test:e2e script to package.json
    - Add node-pty and @playwright/test as devDependencies
  out:
    - Changes to src/ code (black-box tests against built artifact only)
    - Mocked or fixture-based tests (existing suite covers those)
    - CI pipeline changes that require API keys or a built binary
    - Performance benchmarks or load testing
    - agent-browser integration (it is a Claude Code skill, not usable in vitest)
done_criteria:
  - tests/e2e/fixtures/sample-project/ exists with committed git state
  - tests/e2e/e2e.config.json.example exists with documented fields
  - tests/e2e/e2e.config.json is in .gitignore
  - bun run test passes without e2e config (e2e tests excluded)
  - bun run test:e2e skips all tests when config or binary is absent
  - >-
    With config + binary: terminal E2E sends a chat prompt via pty, asserts LLM response appears in
    TUI output
  - 'With binary: CLI smoke tests pass (--help, version, doctor, run with real LLM)'
  - >-
    With config + binary: dashboard browser tests verify SPA load, SSE events, sessions, scheduler
    status, and auth
  - >-
    Tool execution test reads fixture package.json and returns "sample-project" — fixture isolation
    verified
  - bun run verify passes with zero regressions
planned_changes: {}
dependencies:
  - 0006-native-executable
  - 0010-real-llm-test
risks:
  - >-
    Real LLM responses are non-deterministic: tests assert response presence and structure, not
    exact content
  - 'node-pty native addon may have build issues on some platforms: pin to a well-tested version'
  - 'Playwright browser install adds ~200MB: use npx playwright install chromium only'
  - 'Dashboard URL is printed inside Ink TUI (PTY output): parsing must strip ANSI codes reliably'
status: complete
notes:
  - All three suites are black-box — no src/ modifications
  - Default binaryPath is node dist/cli/index.js (available after bun run build)
  - Dashboard auto-starts in chat/code mode — no --dashboard flag needed
  - Non-interactive LLM testing uses dspec run, not chat --prompt (which does not exist)
  - Playwright is used directly, not agent-browser (which is a Claude Code skill)
  - Fixture project is minimal but realistic with package.json, TS source, and git history

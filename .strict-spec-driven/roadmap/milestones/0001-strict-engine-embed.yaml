schema: strict-spec-driven/roadmap-milestone/v2
schema_version: 2
artifact_type: roadmap_milestone
schema_file: ../schemas/roadmap-milestone.yaml
milestone:
  0001-strict-engine-embed:
    title: 'M1: Embed Strict-Spec Engine and Skills'
goal: |
  Bundle the strict-spec-driven.js engine and core skills into Reasonix as
  first-class built-in capabilities so the agent can execute strict YAML
  workflows without depending on external Claude Code skill installation.
scope:
  in:
    - Embed strict-spec-driven.js into the published package under vendor/
    - Create a typed engine invoker wrapper that calls subcommands and returns structured results
    - Register core workflow skills as built-in Reasonix skills in src/skills.ts
    - Add /strict-* slash commands to src/cli/ui/slash/commands.ts
    - Wire JS CLI subcommands into the tool registry as dispatchable tools
  out:
    - Lifecycle state machine (M2)
    - Roadmap-driven auto pipeline (M3)
    - Free-form auto pipeline (M4)
    - TUI and E2E (M5)
done_criteria:
  - strict-spec-driven.js is in vendor/ and listed in package.json files array
  - Engine invoker wraps all subcommand calls with typed input/output
  - All /strict-* slash commands appear in autocomplete and dispatch correctly
  - Tool registry entries exist for each strict-spec subcommand
  - npm run verify passes with the new code
planned_changes: {}
dependencies: []
risks:
  - strict-spec-driven.js is 715 KB and may bloat the install
  - Skill manifest format differs between Claude Code and Reasonix SkillStore
status: complete
notes:
  - Foundation milestone. All later milestones depend on the engine being available
  - Two workflow paths share this foundation. Roadmap-driven is M3, free-form is M4

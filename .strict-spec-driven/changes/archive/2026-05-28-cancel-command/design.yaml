schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: cancel-command
approach:
  - >-
    Create src/strict/cancel.ts with a cancelChange function that: (1) reads the change state via
    ChangeLifecycle.readCurrentState, (2) validates it is proposed or applied using requireState,
    (3) calls attemptTransition to move to canceled state, (4) optionally removes the change
    directory if the caller requests cleanup. Wire this as a /strict-cancel slash command in the
    tool dispatch registry, reusing the existing requireState guard pattern.
decisions:
  state-guard:
    decision: >-
      Reuse requireState(changeName, 'proposed', 'applied') from ChangeLifecycle for the state
      guard, consistent with other strict tools
    rationale: >-
      All other strict tools use requireState; keeping the same pattern ensures consistency and
      leverages existing tested infrastructure
alternatives: []
risks: []

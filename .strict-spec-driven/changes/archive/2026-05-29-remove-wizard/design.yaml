schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: remove-wizard
approach:
  - >-
    Delete Wizard.tsx after extracting validateDeepSeekApiKey to a standalone module. Modify
    resolveBareCommandMode to always return 'code'. On first run (setupCompleted absent), write
    default config with setupCompleted:true and print API key hint if no key found. Simplify /setup
    command to single API key input step. Remove all wizard.* i18n keys.
decisions:
  first-run-hint:
    decision: >-
      Print a non-blocking hint instead of blocking wizard — the user can still use all non-model
      features
    rationale: Non-blocking hint preserves user agency while still guiding to API key setup
alternatives: []
risks: []

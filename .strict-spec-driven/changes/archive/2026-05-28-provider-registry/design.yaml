schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: provider-registry
approach:
  - >-
    Part A: Update ModelClient port to define chat() and stream() with typed request/response shapes
    matching current DeepSeekClient usage. Add provider capability metadata (supportsThinking,
    supportsReasoningContent). Part B: Create ProviderRegistry class that maps provider IDs to
    factory functions. Each factory takes config and returns a client typed against ModelClient.
    Export resolveModelClient() that reads active provider and returns the correct client.
decisions:
  port-first:
    decision: >-
      Update the port interface before creating the registry so that factories return a well-typed
      interface from day one
    rationale: >-
      The port is the contract all consumers depend on. Aligning it first means the registry,
      adapters, and call-site retyping can all compile against a stable target.
alternatives: []
risks: []

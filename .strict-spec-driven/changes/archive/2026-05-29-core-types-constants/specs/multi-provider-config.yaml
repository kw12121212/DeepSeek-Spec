schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: multi-provider-config
mapping:
  implementation:
    - src/config.ts
  tests:
    - tests/config.test.ts
operations:
  ADDED: {}
  MODIFIED:
    provider-field:
      strength: MUST
      statement: >-
        DeepSeekSpecConfig MUST include a provider field accepting 'deepseek' or 'glm', defaulting
        to 'deepseek'
      scenarios:
        provider-default-rename:
          - GIVEN: a config.json with no provider field
          - WHEN: readConfig() is called
          - THEN: the returned config has provider set to 'deepseek' (type is now DeepSeekSpecConfig)
    glm-config-section:
      strength: MUST
      statement: DeepSeekSpecConfig MUST include a glm section with optional apiKey and baseUrl fields
      scenarios:
        glm-section-rename:
          - GIVEN: a config.json with a glm section containing apiKey and baseUrl
          - WHEN: readConfig() is called
          - THEN: >-
              the returned config has glm.apiKey and glm.baseUrl populated (type is now
              DeepSeekSpecConfig)
  REMOVED: {}

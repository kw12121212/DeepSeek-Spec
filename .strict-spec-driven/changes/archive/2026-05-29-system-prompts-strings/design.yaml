schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: system-prompts-strings
approach:
  - >-
    Mechanical find-and-replace of all 'Reasonix' string literals across system prompts, i18n locale
    files, dashboard HTML, and CLI help text. No structural changes — pure content rename.
decisions:
  string-replace:
    decision: >-
      Use case-sensitive global replace for 'Reasonix' -> 'DeepSeek-Spec' in user-facing strings,
      'REASONIX' -> 'DSPEC' in meta tokens and identifiers within strings.
    rationale: >-
      Clean cut rename with no backward compat. All 5 locale files get the same treatment. Dashboard
      meta tokens rename in lockstep.
alternatives: []
risks: []

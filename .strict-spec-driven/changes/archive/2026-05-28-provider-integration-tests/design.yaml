schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: provider-integration-tests
approach:
  - >-
    Fixture-based integration tests: pre-recorded SSE text files for GLM responses, nock-based HTTP
    mocking for DeepSeek regression. Tests validate streaming, tool-calls, multi-turn, error
    handling, auth, usage tracking, and capability guards against the multi-provider-config spec
    requirements.
decisions:
  fixture-strategy:
    decision: >-
      Use raw SSE text fixtures stored in tests/provider/fixtures/glm/ rather than nock recordings,
      because GLM SSE format may diverge from standard OpenAI in subtle ways and raw fixtures are
      easier to inspect and hand-correct
    rationale: >-
      Recorded fixtures give deterministic CI without API keys, while raw SSE files are
      human-readable and editable for edge-case coverage
alternatives: []
risks: []

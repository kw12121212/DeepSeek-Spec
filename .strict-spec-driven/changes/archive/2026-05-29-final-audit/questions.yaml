resolved:
  - id: historical-reasonix-in-specs
    question: >-
      Several spec files contain 'reasonix' in verification scenarios (grep -ri reasonix ... is
      executed) and historical notes (was reasonix). Should these be preserved as-is since they
      describe the rename itself, or cleaned up?
    context: >-
      See agent-loop.yaml, event-kernel.yaml, telemetry.yaml, native-build-script.yaml,
      multi-provider-config.yaml, embedded-assets.yaml — all contain 'reasonix' in WHEN/THEN clauses
      testing that the rename is complete.
    answer: >-
      Preserve verification criteria (grep -ri reasonix ... is executed) and historical notes (was
      reasonix). These describe the rename itself. Only fix stale references where 'reasonix'
      appears as the current/canonical value (e.g. ~/.reasonix/usage.jsonl -> ~/.dspec/usage.jsonl).
    status: resolved

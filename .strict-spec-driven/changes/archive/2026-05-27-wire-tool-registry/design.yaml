schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: wire-tool-registry
approach:
  - >-
    Add a strictTools array in src/strict/strict-tools.ts that defines one ToolSpec per subcommand.
    Each tool handler calls invokeStrict() with the subcommand name and JSON args. Register all
    tools via ToolRegistry.register() during app bootstrap. Tools are parallelSafe: false since they
    mutate filesystem state.
decisions:
  tool-naming:
    decision: >-
      Tool names use snake_case prefix strict_ (e.g. strict_propose) matching the subcommand names
      from the engine
    rationale: >-
      Consistent with existing tool naming conventions and avoids collision with slash command names
      which use hyphens
  parallel-safety:
    decision: 'All strict tools set parallelSafe: false'
    rationale: >-
      Strict workflow commands mutate filesystem state (create/change files under
      .strict-spec-driven/) and must not run concurrently
alternatives: []
risks: []

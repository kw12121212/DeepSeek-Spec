resolved:
  - id: context-compaction-format
    question: >-
      What format should the compact running note use at each lifecycle gate — a structured YAML
      summary appended to a change-local file, or a plain-text summary injected back into the
      conversation context?
    context: >-
      The planned-change details say 'summarize completed step into compact running note and compact
      context' but do not specify the serialization format or storage location.
    answer: >-
      AutoPipeline returns structured results per step ({ step, ok, data?, error? }). Context
      compaction is the caller's responsibility, not the module's. The module does not write running
      note files.
    status: resolved

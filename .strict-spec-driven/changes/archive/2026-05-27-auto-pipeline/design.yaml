schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: auto-pipeline
approach:
  - >-
    Create an AutoPipeline class in src/strict/auto-pipeline.ts that orchestrates the six lifecycle
    steps sequentially. Each step calls the corresponding invokeStrict subcommand, then runs npm run
    verify as a gate check. If the gate fails, the pipeline pauses and returns a structured error to
    the caller. If the gate passes, a compact running note is appended summarizing the completed
    step. After archive, roadmap-sync is called. The pipeline supports a --from flag to resume from
    any step. A new tool definition in src/tools/strict-auto.ts wraps the pipeline as a dispatchable
    agent tool.
decisions:
  step-runner:
    decision: Single class with ordered step array and gate-check loop
    rationale: >-
      Keeps the pipeline easy to test, debug, and extend. Each step is a named method, making it
      straightforward to resume from any point or add new steps later.
alternatives: []
risks: []

schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: provider-aware-loop
  status: proposed
summary:
  what:
    - Retype all DeepSeekClient type references to the updated ModelClient provider port interface
  why:
    - >-
      The provider registry, GLM adapter, and OpenAICompatClient base are all complete. The
      remaining gap is that loop.ts, streaming.ts, and 6 non-streaming call sites still import
      DeepSeekClient directly. Without this retyping, the multi-provider infrastructure cannot be
      used.
scope:
  in:
    - >-
      src/loop.ts, src/loop/streaming.ts, src/cli/commands/desktop.ts, src/cli/commands/commit.ts,
      src/session-title.ts, src/loop/force-summary.ts, src/context-manager.ts
  out:
    - All call sites retyped to the provider port interface with no behavioral change for DeepSeek
unchanged_behavior:
  - Tool definitions, TUI, MCP, repair pipeline, config resolution
roadmap:
  milestone: 0007-multi-provider-api
  planned_change: provider-aware-loop

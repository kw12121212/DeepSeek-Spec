schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: provider-aware-loop
approach:
  - >-
    Type-level retyping: replace all DeepSeekClient imports and type annotations with the
    ModelClient port interface. Guard provider-specific features (thinking, reasoning_content)
    behind capability flags from the active provider.
decisions:
  capability-guard:
    decision: >-
      Use provider.capabilities.supportsThinking and supportsReasoningContent to guard
      thinkingModeForModel() calls and reasoning_content parsing
    rationale: >-
      GLM does not support thinking or reasoning_content. Hardcoding these behind DeepSeek-only code
      paths would break GLM sessions. Capability flags are already defined in the port interface.
alternatives: []
risks: []

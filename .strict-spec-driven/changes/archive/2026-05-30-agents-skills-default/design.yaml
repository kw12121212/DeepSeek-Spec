schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: agents-skills-default
approach:
  - >-
    Remove .dspec/skills from SkillStore.roots() entirely. Make .agents/skills the primary default
    for both project and global scopes. Update server API helpers and create() to target
    .agents/skills. Update all tests that reference .dspec/skills to use .agents/skills.
decisions:
  remove-dspec:
    decision: >-
      Drop .dspec/skills from all skill roots; .agents/skills becomes the primary, .claude/skills
      the fallback
    rationale: >-
      User explicitly deprecated .dspec/skills; clean removal avoids confusion about which directory
      is canonical
alternatives: []
risks: []

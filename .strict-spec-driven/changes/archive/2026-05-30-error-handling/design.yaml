schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: error-handling
approach:
  - >-
    Create tests/real-llm/errors.test.ts following the existing chat.test.ts pattern: import helpers
    from helpers/config, use describe.skipIf(!hasRealLlmConfig()) to auto-skip, create a GLMClient
    with an intentionally invalid API key but the real baseUrl, send a chat request, and assert the
    rejection message contains 401 or 403
decisions:
  invalid-key-strategy:
    decision: >-
      Use apiKey: 'invalid.key123' with the real baseUrl from config so the request reaches the real
      API endpoint and gets a proper 401/403 response rather than a connection error
    rationale: >-
      Using a syntactically valid-looking but wrong key ensures the API endpoint actually processes
      the auth and returns a proper HTTP error status
alternatives: []
risks: []

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: add-slash-commands
approach:
  - >-
    Add a new 'strict' SlashGroup and register 12 slash commands (/strict-init through /strict-auto)
    that each dispatch to the corresponding built-in strict-spec skill. Add 'strict' to
    SLASH_GROUP_ORDER after 'extend' and before 'session'. Each command accepts optional args
    (change name or free text) that pass through to the skill.
decisions:
  slash-group:
    decision: Use a dedicated 'strict' SlashGroup rather than reusing 'extend' or 'advanced'
    rationale: >-
      Strict-spec workflows are a first-class feature surface with 12+ commands — they deserve their
      own group for discoverability, rather than being buried in a mixed group.
alternatives: []
risks: []

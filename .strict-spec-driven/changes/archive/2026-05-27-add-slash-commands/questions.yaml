change: add-slash-commands
open: []
resolved:
  - id: slash-dispatch-path
    question: >-
      How should /strict-* commands dispatch to skills — reuse the /skill dispatch path internally,
      or route through a new strict-specific handler in the slash handler?
    context: >-
      The existing /skill command dispatches to SkillStore. /strict-* could either be aliases that
      translate to /skill strict-* internally, or they could have their own dispatch that calls
      invokeStrict directly.
    answer: >-
      Reuse /skill dispatch path via SkillStore — map /strict-* command names to corresponding
      built-in skill names and dispatch through the existing skill invocation mechanism.
    status: resolved

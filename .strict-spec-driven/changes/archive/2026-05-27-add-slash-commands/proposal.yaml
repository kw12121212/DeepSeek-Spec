    - src/cli/ui/slash/commands.ts, src/cli/ui/slash/types.ts
unchanged_behavior:
  - src/skills.ts, src/strict/, vendor/
roadmap:
  milestone: 0001-strict-engine-embed
  planned_change: add-slash-commands

schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: embedded-assets
mapping:
  implementation:
    - >-
      src/cli/*.ts, src/index.ts, desktop/src/**/*.ts, desktop/src-tauri/*.json,
      dashboard/src/**/*.ts
  tests:
    - tests/
operations:
  ADDED: {}
  MODIFIED:
    brand-rename:
      strength: MUST
      statement: >-
        CLI, desktop, and dashboard source code references to 'reasonix' are replaced with
        DeepSeek-Spec naming
      scenarios:
        grep-clean:
          - GIVEN: dependency changes are applied
          - WHEN: >-
              grep -ri reasonix src/cli/ src/index.ts desktop/src/ desktop/src-tauri/ dashboard/src/
              is executed
          - THEN: zero matches are returned
  REMOVED: {}

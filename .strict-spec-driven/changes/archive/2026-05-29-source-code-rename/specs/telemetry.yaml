schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: telemetry
mapping:
  implementation:
    - src/telemetry/*.ts
  tests:
    - tests/
operations:
  ADDED: {}
  MODIFIED:
    brand-rename:
      strength: MUST
      statement: All telemetry source code references to 'reasonix' are replaced with DeepSeek-Spec naming
      scenarios:
        grep-clean:
          - GIVEN: dependency changes are applied
          - WHEN: grep -ri reasonix src/telemetry/ is executed
          - THEN: zero matches are returned
  REMOVED: {}

schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: agent-loop
mapping:
  implementation:
    - src/loop/*.ts, src/core/*.ts
  tests:
    - tests/
operations:
  ADDED: {}
  MODIFIED:
    brand-rename:
      strength: MUST
      statement: >-
        All source code references to 'reasonix' in src/loop/ and src/core/ are replaced with
        DeepSeek-Spec naming conventions
      scenarios:
        grep-clean:
          - GIVEN: >-
              all dependency changes (env-vars, config-dir-paths, core-types-constants,
              system-prompts-strings) are applied
          - WHEN: grep -ri reasonix src/loop/ src/core/ is executed
          - THEN: zero matches are returned
  REMOVED: {}

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: execution-history
approach:
  - >-
    Create src/scheduler/history.ts with HistoryEntry interface and HistoryStore class backed by
    .dspec/scheduled-history.json. HistoryStore appends entries after each execution (called by the
    daemon, not the executor), prunes per-task entries at 500 cap, and supports query by taskId or
    globally. The /schedule history command in src/cli/commands/schedule.ts looks up a task by name
    or ID and displays its execution log with timestamps, status icons, duration, and output
    snippets. All user-facing strings go through t() from src/i18n/.
decisions:
  history-persistence:
    decision: >-
      Daemon calls historyStore.append() after each execution rather than the executor doing it,
      keeping executor free of persistence concerns and avoiding circular deps
    rationale: >-
      Separating history recording from execution keeps the executor focused and testable. The
      daemon already orchestrates execution results so it naturally owns post-execution bookkeeping.
alternatives: []
risks: []

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: shared-config
approach:
  - >-
    Create tests/e2e/ directory with three helpers (config reader, fixture worktree manager, ANSI
    stripper), a committed git fixture project under fixtures/sample-project/, and a gitignored
    e2e.config.json config template. Update vitest.config.ts to exclude tests/e2e/** from default
    test runs. Add test:e2e script and devDependencies (node-pty, @playwright/test). Reuse patterns
    from tests/real-llm/helpers/config.ts.
decisions:
  fixture-isolation:
    decision: >-
      Use temp directory copy per test via createFixtureWorktree() instead of git worktree, because
      the fixture is small and file copy is simpler and more portable than git worktree commands.
    rationale: >-
      Simple file copy avoids git worktree edge cases across platforms and keeps the helper
      dependency-free.
alternatives: []
risks: []

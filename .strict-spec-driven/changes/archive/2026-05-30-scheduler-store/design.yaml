schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: scheduler-store
approach:
  - >-
    Create src/scheduler/store.ts exporting the ScheduledTask interface and TaskStore class.
    TaskStore wraps a single JSON file (.dspec/scheduled.json) with atomic writes (write to .tmp,
    rename). IDs are 8-char nanoid. All timestamps ISO 8601 UTC. Load returns [] on missing or
    malformed file. Tests in tests/scheduler/store.test.ts cover CRUD round-trip, atomic write crash
    simulation, lookups, and error handling.
decisions:
  store-location:
    decision: Place store in src/scheduler/store.ts
    rationale: >-
      Follows project convention of domain-per-directory under src/. Scheduler is a new domain with
      its own subdirectory.
alternatives: []
risks: []

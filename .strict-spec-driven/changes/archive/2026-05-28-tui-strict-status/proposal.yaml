schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: tui-strict-status
  status: proposed
summary:
  what:
    - >-
      Add strict status indicator to TUI top bar and ensure all /strict-* commands are in slash
      autocomplete
  why:
    - >-
      Users need to see active strict change name and lifecycle state at a glance in the TUI, and
      discover strict commands via autocomplete
scope:
  in:
    - src/cli/ui/layout/StatusRow.tsx, src/cli/ui/slash/commands.ts, src/strict/
  out:
    - >-
      TUI top bar shows active strict change with state; /strict-* commands appear in autocomplete
      under strict group
unchanged_behavior:
  - strict lifecycle logic, tool dispatch, non-TUI components
roadmap:
  milestone: 0005-e2e-hardening
  planned_change: tui-strict-status

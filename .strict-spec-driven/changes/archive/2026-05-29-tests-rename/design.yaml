schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: tests-rename
approach:
  - >-
    Systematic find-and-replace across tests/ in this order: (1) grep all .ts/.js/.json files for
    reasonix (case-insensitive), (2) replace type names (ReasonixConfig -> DeepSeekSpecConfig), (3)
    replace env var prefixes (REASONIX_ -> DSPEC_), (4) replace directory paths (.reasonix ->
    .dspec), (5) replace binary/package names (reasonix -> dspec, deepseek-spec), (6) update test
    descriptions and assertion messages, (7) verify with grep -ri reasonix tests/ returning zero.
decisions:
  mechanical-replace:
    decision: >-
      Use direct string replacement in each file rather than codemods, since the changes are
      confined to test code with no runtime impact.
    rationale: >-
      Test files are self-contained and safe to batch-rename. No production code is affected, so the
      risk surface is limited to test correctness.
alternatives: []
risks: []

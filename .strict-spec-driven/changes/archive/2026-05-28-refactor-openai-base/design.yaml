schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: refactor-openai-base
approach:
  - >-
    Extract OpenAICompatClient into src/adapters/model-openai-compat.ts owning generic
    /chat/completions logic (HTTP construction, auth header, retry, rate limiting, timeout, SSE
    parsing, non-streaming parsing, usage accumulation, standard delta parsing, error parsing).
    DeepSeekClient becomes a thin subclass adding: default baseUrl, thinking mode, reasoning_content
    parsing, surrogate sanitization, extended timeout, Azure detection, getBalance/listModels.
    Method signatures (chat, stream) stay identical.
decisions:
  subclass-vs-delegation:
    decision: >-
      Use subclass (DeepSeekClient extends OpenAICompatClient) rather than delegation to preserve
      all existing type relationships and avoid wrapping overhead
    rationale: >-
      DeepSeekClient already has the right method signatures; subclassing is the smallest diff with
      zero call-site changes
alternatives: []
risks: []

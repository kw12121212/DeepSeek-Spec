schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: native-build-script
  status: proposed
summary:
  what:
    - >-
      Create scripts/build-native.mjs that wraps bun build --compile to produce standalone native
      executables for supported target platforms
  why:
    - >-
      Unlocks M6 native executable distribution; all other M6 planned changes (cross-platform-ci,
      embed-static-assets, native-runtime-paths, install-scripts) depend on this build script
      existing first
scope:
  in:
    - No native build script exists; build output is JS only via tsup
  out:
    - scripts/build-native.mjs compiles per-target standalone binaries from the existing tsup output
unchanged_behavior:
  - tsup build pipeline, existing npm scripts unrelated to native builds, all runtime source code
roadmap:
  milestone: 0006-native-executable
  planned_change: native-build-script

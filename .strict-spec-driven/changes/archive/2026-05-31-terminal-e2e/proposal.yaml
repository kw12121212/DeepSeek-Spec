schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: terminal-e2e
  status: proposed
summary:
  what:
    - >-
      Create terminal E2E tests that spawn the built binary in a node-pty pseudo-terminal to test
      interactive chat mode with a real LLM, validating prompts get responses and tools execute
      correctly through the Ink TUI
  why:
    - >-
      M14 requires black-box terminal E2E tests to validate the full interactive experience with a
      real LLM, complementing CLI smoke tests and dashboard browser tests
scope:
  in:
    - tests/e2e/terminal/
  out:
    - Black-box test artifacts only — no src/ code changes
unchanged_behavior:
  - All existing src/ code, existing test suites, CLI smoke tests, dashboard browser tests
roadmap:
  milestone: 0014-binary-e2e-testing
  planned_change: terminal-e2e

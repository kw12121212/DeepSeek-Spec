schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: terminal-e2e
approach:
  - >-
    Create tests/e2e/terminal/ with a PTY helper module and three test files. The helper spawns the
    binary via node-pty (24x80), provides waitUntil() for pattern matching on stripped output, and
    auto-skips when config or binary is absent. Each test file spawns interactive mode, sends
    prompts via PTY, and asserts responses appear within timeout.
decisions:
  pty-over-child-process:
    decision: >-
      Ink TUI requires a real TTY to render — child_process provides no PTY. Terminal features
      (colors, cursor, line editing) only work with PTY.
    rationale: >-
      Tests must verify the full interactive experience end-to-end, not just stdout. node-pty
      provides the real terminal environment Ink expects.
alternatives: []
risks: []

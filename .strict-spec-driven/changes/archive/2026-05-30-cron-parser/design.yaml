schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: cron-parser
approach:
  - >-
    Create a single module src/scheduler/cron-parser.ts that exports four functions: parseCron
    (string to CronFields), matchesCron (check if a Date matches), nextRun (compute next matching
    time), and describeCron (human-readable description). The parser handles standard 5-field cron
    syntax (minute hour day-of-month month day-of-week) with wildcards, ranges, steps, and lists. No
    external dependencies — pure functions with no side effects.
decisions:
  cron-field-parsing:
    decision: >-
      Parse each field independently into a set of allowed values (Set<number>), then combine for
      matching. This avoids complex AST representations and keeps the implementation simple and
      testable.
    rationale: >-
      Set-based matching is straightforward: parse each field into its allowed values, then check
      membership. For nextRun, iterate minute-by-minute from the starting time (max 1440 iterations
      = one day) which is fast enough for a 30-second tick interval. describeCron uses pattern
      matching against common expressions rather than a general-purpose formatter.
alternatives: []
risks: []

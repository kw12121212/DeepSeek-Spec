schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: multi-provider-config
mapping:
  implementation:
    - tests/real-llm/helpers/config.ts
  tests:
    - tests/real-llm-config-helper.test.ts
operations:
  ADDED:
    real-llm-test-infra:
      strength: MUST
      statement: >-
        Real-LLM test infrastructure MUST provide readRealLlmConfig, hasRealLlmConfig, and
        createRealLlmClient helpers that read from tests/real-llm.config.json and auto-skip when
        absent.
      scenarios:
        config-absent-skip:
          - GIVEN: tests/real-llm.config.json does not exist
          - WHEN: hasRealLlmConfig() is called
          - THEN: returns false
        config-valid-read:
          - GIVEN: tests/real-llm.config.json exists with valid zhipuApiKey and model
          - WHEN: readRealLlmConfig() is called
          - THEN: returns { zhipuApiKey, model, baseUrl? }
  MODIFIED: {}
  REMOVED: {}

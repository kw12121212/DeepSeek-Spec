resolved:
  - id: ci-permissions
    question: >-
      Does the repository already have GitHub Actions enabled, and does the default GITHUB_TOKEN
      have write permissions for creating releases?
    context: The workflow needs contents:write permission to create releases and upload assets
    answer: >-
      Use explicit permissions: contents: write in the workflow file. This works regardless of
      repo-level settings and follows least-privilege.
    status: resolved

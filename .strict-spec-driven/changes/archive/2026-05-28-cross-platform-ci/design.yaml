schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: cross-platform-ci
approach:
  - >-
    Create .github/workflows/build-native.yml with a matrix strategy for 5 targets (linux-x64,
    linux-arm64, darwin-x64, darwin-arm64, windows-x64). Each matrix job checks out the repo, sets
    up Bun, installs deps, runs tsup build, then runs the native build script for its target. After
    the matrix, a separate job creates a GitHub Release and uploads all binaries plus a SHA256
    checksums file.
decisions:
  runner-selection:
    decision: >-
      Use ubuntu-latest for linux targets, macos-latest for darwin targets, windows-latest for
      windows target
    rationale: >-
      GitHub Actions provides native runners for all three OS families; no cross-compilation
      toolchain needed
alternatives: []
risks: []

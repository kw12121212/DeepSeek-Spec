schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: readme-docs
approach:
  - >-
    Add a new 'Strict Spec Workflows' section to README.md between the existing sections. The
    section should be under 60 lines, cover quick start, roadmap-driven workflow, free-form
    workflow, and individual command reference as specified in the planned change details.
decisions:
  doc-placement:
    decision: Place the new section after the existing 'Commands' section and before 'Configuration'
    rationale: >-
      This placement follows the natural reading order: after users learn commands, they see how to
      use the strict-spec workflow; configuration explanation comes after workflow documentation
alternatives: []
risks: []

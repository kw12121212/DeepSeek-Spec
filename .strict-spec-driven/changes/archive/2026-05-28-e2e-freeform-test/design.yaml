schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: e2e-freeform-test
approach:
  - >-
    Create a single E2E test file that exercises the free-form strict workflow against a temporary
    fixture project. Use the existing invoker to call strict subcommands (init, propose, generate,
    apply, modify, verify, review, archive, ship, cancel) with spied/recorded responses. Each test
    case sets up a fresh fixture directory, runs the full lifecycle, and asserts state transitions,
    file existence, and directory cleanup at each step.
decisions:
  fixture-strategy:
    decision: >-
      Use a temporary directory with an empty .strict-spec-driven/ as the fixture project rather
      than mocking the filesystem
    rationale: Real filesystem operations give higher confidence than mocks; the test is E2E by definition
alternatives: []
risks: []

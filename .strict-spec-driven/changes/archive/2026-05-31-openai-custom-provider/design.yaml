schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: openai-custom-provider
approach:
  - >-
    Extend ProviderId to include 'openai'. Add OpenAICustomProviderConfig to DeepSeekSpecConfig with
    apiKey, baseUrl, and models fields. Create OpenAICustomClient extending OpenAICompatClient that
    reads config. Register 'openai' provider in ProviderRegistry with user-specified models or a
    wildcard. Update modelToProvider to map 'openai-*' prefix. Env vars: OPENAI_API_KEY,
    OPENAI_BASE_URL for the custom provider.
decisions:
  config-driven-models:
    decision: >-
      Models list comes from config.json openai.models array. If empty or absent, the provider
      accepts any model ID (wildcard mode) to maximize flexibility.
    rationale: >-
      Hardcoding model IDs defeats the purpose of a generic provider. Users configure their own
      models based on what their endpoint supports.
alternatives: []
risks: []

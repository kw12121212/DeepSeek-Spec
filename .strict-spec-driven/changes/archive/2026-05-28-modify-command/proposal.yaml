schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: modify-command
  status: proposed
summary:
  what:
    - >-
      Implement /strict-modify command that reads an active change, shows current scope, accepts
      modifications as free text, and updates proposal.yaml and design.yaml with explicit user
      confirmation
  why:
    - >-
      Users need to expand or adjust the scope of an in-flight strict change without canceling and
      re-proposing. The modify command provides a controlled mid-flight adjustment mechanism that
      preserves change history and warns when re-apply may be needed.
scope:
  in:
    - >-
      src/strict/modify.ts (new), src/strict/strict-tools.ts (add modify tool registration),
      src/strict/guard.ts (add modify state guard)
  out:
    - >-
      E2E testing and TUI hardening (M5), roadmap recommend logic (M3), brainstorm tool (already
      implemented)
unchanged_behavior:
  - >-
    src/strict/lifecycle.ts, src/strict/cancel.ts, src/strict/propose.ts, src/strict/brainstorm.ts,
    src/strict/auto-pipeline.ts
roadmap:
  milestone: 0004-freeform-workflow
  planned_change: modify-command

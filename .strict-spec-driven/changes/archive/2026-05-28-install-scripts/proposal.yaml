schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: install-scripts
  status: proposed
summary:
  what:
    - >-
      Local install scripts (shell for Linux/macOS, PowerShell for Windows) that copy the compiled
      native binary from dist/native/ to the user's bin directory, and a smoke-test script that
      verifies the binary starts correctly
  why:
    - >-
      Users need a simple local install command to deploy the compiled native binary to their PATH
      without network access
scope:
  in:
    - scripts/install.sh scripts/install.ps1 scripts/smoke-native.mjs package.json dist/native/
  out:
    - ~/.local/bin/ (Unix), %USERPROFILE%\bin\ (Windows)
unchanged_behavior:
  - src/ (no source changes), existing npm distribution, no GitHub CI/CD
roadmap:
  milestone: 0006-native-executable
  planned_change: install-scripts

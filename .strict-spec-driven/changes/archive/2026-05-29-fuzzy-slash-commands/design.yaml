schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: fuzzy-slash-commands
approach:
  - >-
    Character-skipping fuzzy scorer in nearest.ts, integrated into suggestSlashCommands with
    prefix-first ordering
decisions:
  scoring-algo:
    decision: >-
      Character-skipping scoring: sequential match bonus +2, gap penalty -1 per skipped target char,
      first-char match bonus +1
    rationale: >-
      Lightweight, no external dependency, deterministic scoring that ranks prefix matches above
      fuzzy-only matches
alternatives: []
risks: []

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: task-executor
approach:
  - >-
    Create TaskExecutor class in src/scheduler/executor.ts that wraps CacheFirstLoop.run() for
    headless execution. Use the shared ModelClient and ToolHost from the scheduler context. Build
    messages with the default system prompt + user task prompt. Enforce timeout via AbortController
    passed to the loop. Write session files to .dspec/scheduled-sessions/<taskId>/<timestamp>.json
    with auto-cleanup keeping last 5 per task. Return TaskExecutionResult with status, timing, and
    output snippet.
decisions:
  session-isolation:
    decision: >-
      Scheduled task sessions are stored in .dspec/scheduled-sessions/ separately from user sessions
      in .dspec/sessions/
    rationale: >-
      Prevents scheduled task artifacts from appearing in /sessions list and avoids
      cross-contamination between automated and interactive session state
alternatives: []
risks: []

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: native-runtime-paths
approach:
  - >-
    Create src/cli/native-detect.ts with detectNativeContext() that returns an object containing
    isNative, assetRoot, and helper methods. Export resolveAsset() and resolveDataFile() functions
    that internally branch on native vs Node context. Update all callers that use __dirname-relative
    or hard-coded asset paths to use these resolver functions. The native path reads from the
    embedded asset registry (AssetRegistry); the Node path preserves existing __dirname-based
    resolution.
decisions:
  native-detect-module:
    decision: >-
      Introduce a dedicated native-detect module rather than conditionally patching each caller
      inline
    rationale: >-
      A single module ensures consistent detection logic, makes it easy to audit all native-vs-Node
      branching in one place, and keeps caller code clean
alternatives: []
risks: []

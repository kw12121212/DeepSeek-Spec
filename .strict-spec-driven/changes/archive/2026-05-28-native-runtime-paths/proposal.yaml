schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: native-runtime-paths
  status: proposed
summary:
  what:
    - >-
      Create a native runtime detection layer and update all runtime asset resolution paths to work
      from both the Node/tsup development context and the compiled Bun executable context
  why:
    - >-
      The embed-static-assets change established the AssetRegistry and detectNative primitives, but
      callers throughout the codebase still use __dirname-based paths to locate data files,
      tree-sitter grammars, and dashboard assets. Without updating these callers, the compiled
      native binary will fail to find its embedded assets at runtime.
scope:
  in:
    - >-
      src/cli/ asset resolution callers, src/tools/ grammar loading, src/server/ dashboard asset
      serving
  out:
    - >-
      src/cli/native-detect.ts (new), updated callers that currently use __dirname or hard-coded
      relative paths to resolve runtime assets
unchanged_behavior:
  - >-
    The existing Node/tsup development and npm distribution path must continue to work identically —
    only native-compiled binary behavior changes
roadmap:
  milestone: 0006-native-executable
  planned_change: native-runtime-paths

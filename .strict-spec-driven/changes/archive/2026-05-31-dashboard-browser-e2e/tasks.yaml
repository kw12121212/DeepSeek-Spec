      status: complete
    create-auth-enforcement-test:
      text: >-
        Create tests/e2e/dashboard/auth-enforcement.test.ts — fetch-based test for token missing
        (401), query param (200 for GET), header (200), CSRF on POST (401 without header).
      status: complete

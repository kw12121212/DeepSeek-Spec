schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: builtin-skill-slash-commands
approach:
  - "Add a resolveSkillDir helper and call it in SkillStore.parse to replace all {{SKILL_DIR}} with dirname of skill.path. For builtin skills where path is the literal string (builtin), skip substitution."
  - "Call resolveSkillDir in SkillStore.parse so every Skill.body is pre-resolved at load time. This fixes the issue for all consumers including slash handlers, run_skill, and the skills index."
  - "Add new SlashCommandSpec entries for non-strict builtins in the extend and code groups in commands.ts."
  - "Create a generic skill-slash handler that works for any builtin skill name, reusing the same pattern as makeStrictHandler."
  - "Wire the new handlers into dispatch.ts."
decisions:
  substitution-at-parse-time:
    decision: "Substitute {{SKILL_DIR}} in SkillStore.parse rather than at each consumption point."
    rationale: "Single point of truth. Every consumer gets the resolved body. Avoids N fix points and the risk of missing one."
  slash-group-placement:
    decision: "Place explore, research, review, security-review in the extend group and test in the code group."
    rationale: "explore/research/review are extension tools. test operates on code edits and fits with apply/discard/walk."
  generic-handler:
    decision: "Refactor makeStrictHandler into a shared makeSkillHandler used by both strict and non-strict builtin slash commands."
    rationale: "Eliminates duplication. The handler logic is identical."
alternatives:
  - option: "Substitute {{SKILL_DIR}} only in handlers/strict.ts and tools/skills.ts at two call sites."
    reason: "Rejected because fragile and easy to miss a future consumer. parse is the single correct place."
risks:
  - "Skill bodies that intentionally contain literal {{SKILL_DIR}} text. Mitigation: the placeholder is a Claude Code convention, no legitimate dspec skill would contain it literally."

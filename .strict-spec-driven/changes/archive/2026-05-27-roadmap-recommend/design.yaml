schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: roadmap-recommend
approach:
  - >-
    Create a pure-function roadmapRecommend(projectRoot) in src/strict/roadmap-recommend.ts. Steps:
    (1) read INDEX.yaml via YAML parse, (2) iterate milestones in declared order, skip complete
    ones, (3) for each proposed/active milestone load the milestone file, (4) scan planned_changes
    entries for standalone status=planned with all depends_on resolved (check archived changes), (5)
    return first match or {eligible: false}. Wire as the logic behind the existing
    strict_roadmap_recommend tool dispatch.
decisions:
  standalone-function:
    decision: Use a standalone exported function rather than a class
    rationale: >-
      Matches existing strict module patterns (config-reader, lifecycle). Stateless function is
      sufficient since roadmap recommend is a one-shot query.
alternatives: []
risks: []

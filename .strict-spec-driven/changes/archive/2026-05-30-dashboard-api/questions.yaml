resolved:
  - id: output-snippet-source
    question: >-
      Should the dashboard API return the outputSnippet field from HistoryStore (already capped at
      200 chars), or should there be a separate truncation layer in the route handler?
    context: >-
      HistoryStore.append already truncates outputSnippet to 200 chars per the scheduled-tasks spec.
      The planned-change says 'Output snippets included (capped at 200 chars)' but does not specify
      whether this is a store concern or route concern.
    answer: >-
      Use the outputSnippet from HistoryStore directly — the store already truncates to 200 chars at
      append time per the scheduled-tasks spec (history-snippet-truncation requirement). No
      additional truncation layer needed in the route handler.
    status: resolved

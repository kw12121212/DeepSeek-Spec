schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: mimo-token-plan
approach:
  - >-
    Mirror the GLM provider pattern: add mimo to ProviderId union, create MimoProviderConfig, create
    MimoClient adapter overriding authHeaders() to emit api-key header instead of Bearer, register
    in provider registry, add to setup wizard and i18n.
decisions:
  openai-compat-inherit:
    decision: >-
      MimoClient extends OpenAICompatClient and only overrides authHeaders() to use api-key header
      instead of Authorization Bearer. The OpenAI-compatible protocol is the same otherwise.
    rationale: >-
      MiMo Token Plan exposes a standard OpenAI-compatible /chat/completions endpoint. The only
      protocol difference is the authentication header name.
alternatives: []
risks: []

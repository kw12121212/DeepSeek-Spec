schema: strict-spec-driven/question-list/v1
schema_version: 1
artifact_type: question_list
schema_file: templates/strict-spec-driven/schemas/question-list.yaml
change: propose-command
open: []
resolved:
  - id: spec-placement
    question: >-
      Should propose-command get its own strict YAML spec (strict-propose) or extend the existing
      strict-lifecycle spec with propose-specific requirements?
    context: >-
      The strict-lifecycle spec already covers state transitions and guards. Propose creates changes
      but doesn't fit the lifecycle transition pattern since it's the entry point that creates the
      initial proposed state.
    status: resolved
    answer: >-
      Create a separate strict-propose.yaml spec. This follows the existing pattern where
      strict-brainstorm.yaml is its own spec despite brainstorm also being lifecycle-adjacent.
      Each tool gets its own spec for clean separation of concerns.

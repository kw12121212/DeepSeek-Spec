schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: loop-wiring
approach:
  - >-
    Extend CacheFirstLoopOptions with optional scheduler config. In CacheFirstLoop init, instantiate
    the scheduler dependency chain (TaskStore -> TaskExecutor -> HistoryStore -> Scheduler) using
    the same ModelClient and ToolHost. Add a shutdown() method to CacheFirstLoop that delegates to
    scheduler.stop(). Hook the shutdown call into the existing SIGINT/SIGTERM handlers in code.tsx
    and chat.tsx before their existing cleanup logic. Ensure scheduled sessions are written to
    .dspec/scheduled-sessions/ and filtered from /sessions output.
decisions:
  session-isolation-strategy:
    decision: >-
      Use .dspec/scheduled-sessions/<taskId>/ as a separate directory tree for scheduled task
      sessions, with auto-cleanup keeping the last 5 per task
    rationale: >-
      Isolates scheduled sessions from user sessions, preventing /sessions noise and enabling
      independent cleanup policies
alternatives: []
risks: []

schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: strict-engine-bundle
mapping:
  implementation:
    - src/strict/strict-tools.ts
  tests:
    - tests/strict-engine-bundle.test.ts
operations:
  ADDED: {}
  MODIFIED:
    tool-registry-entries:
      strength: MUST
      statement: >-
        The ToolRegistry MUST include entries for strict_roadmap_status and strict_roadmap_sync with
        parallelSafe=false and no changeName parameter.
      scenarios:
        roadmap-status-registered:
          - GIVEN: the ToolRegistry is initialized with default tools
          - WHEN: list() is called and filtered for strict_roadmap_status
          - THEN: >-
              exactly one tool entry is returned with parallelSafe=false and no changeName in its
              parameter schema
  REMOVED: {}

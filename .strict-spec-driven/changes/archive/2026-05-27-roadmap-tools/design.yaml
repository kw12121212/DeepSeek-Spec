schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: roadmap-tools
approach:
  - >-
    Verify existing tool registrations in src/strict/strict-tools.ts for strict_roadmap_status and
    strict_roadmap_sync match the spec requirements. Add dedicated unit tests for both tools
    confirming: invokeStrict is called with correct subcommand, parallelSafe is false, no changeName
    parameter is required, and structured results are returned.
decisions:
  use-existing-registration:
    decision: >-
      The registrations already exist in STRICT_TOOLS with correct subcommands, parallelSafe=false,
      and requiresChangeName=false. The change adds test coverage rather than new implementation.
    rationale: >-
      The engine-invoker dependency is complete and the tools were registered as part of the
      wire-tool-registry change. Duplicating registration logic would be redundant.
alternatives: []
risks: []

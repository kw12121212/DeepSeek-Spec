schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: freeform-auto
approach:
  - >-
    Add a runFreeformPipeline function alongside the existing runAutoPipeline. The freeform variant
    replaces the recommend step with a propose step using the user's description, then continues
    through apply->verify->review->archive->ship with the same gate-check logic. The
    strict_auto_pipeline tool detects the variant by checking for a description argument — if
    present, run freeform; if absent, run roadmap-driven. Reuses the same STEPS array and
    STEP_SUBCOMMANDS map but substitutes propose for recommend.
decisions:
  variant-detection:
    decision: >-
      Detect freeform vs roadmap variant by presence of description parameter on the tool call, not
      a separate tool
    rationale: >-
      A single tool with variant detection keeps the tool surface small and matches the UX pattern
      of /strict-auto <description> vs /strict-auto
alternatives: []
risks: []

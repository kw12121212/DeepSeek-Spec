change: engine-invoker
open: []
resolved:
  - id: cwd-handling
    question: >-
      Should invokeStrict forward the caller's cwd to the child process, or should the caller pass
      an explicit cwd argument?
    context: >-
      Some strict-spec subcommands (e.g., propose, apply) are cwd-sensitive. The invoker needs to
      decide which directory the child runs in.
    answer: Caller passes an explicit cwd argument to invokeStrict. Defaults to process.cwd() if omitted.
    status: resolved

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: default-yolo-mode
approach:
  - >-
    Single-line default change in loadEditMode() fallback from 'review' to 'yolo'. Update test
    assertions in tests/config.test.ts that expect 'review' as the default to expect 'yolo'. No new
    modules, no new types, no structural changes.
decisions:
  edit-mode-fallback:
    decision: Change the hardcoded fallback in loadEditMode() rather than adding a new default config entry
    rationale: >-
      Keeping the fallback as the single source of truth avoids duplicating the default across code
      and config template. The planned change details explicitly state that the default config
      should NOT include an explicit editMode field.
alternatives: []
risks: []

schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: lifecycle-module
approach:
  - >-
    State machine implemented as a typed enum + static transition table in ChangeLifecycle class.
    States: proposed, applied, verified, reviewed, archived, shipped, canceled. Transition map
    defines valid (from, to) pairs. attemptTransition validates against the map, reads current state
    from proposal.yaml change.status, and writes new state on success. readCurrentState parses proposal.yaml change.status and
    returns the typed state. All file I/O uses the existing engine-path helpers.
decisions:
  state-model:
    decision: >-
      Use a string literal union type for ChangeState rather than a numeric enum. String states are
      human-readable in proposal.yaml and match the external strict-spec-driven.js format.
    rationale: >-
      String states ensure compatibility with the existing proposal.yaml change.status format that
      strict-spec-driven.js reads and writes.
alternatives: []
risks: []

      status: not_run
      evidence: []
    logs: []
    stop:
      command: strict-spec-driven dev-session-stop
      status: not_run
      evidence: []
    cleanup_status: not_needed
  unavailable_conditions: []
replay:
  commands:
    - id: build-and-install
      command: "./setup.sh"
      working_directory: "/home/wx766/Code/DeepSeek-Spec"
      layer: web_api
      expected_result: "Standalone binary installed to ~/.local/bin/deepseek-spec"
    - id: run-and-observe
      command: "deepseek-spec"
      working_directory: "/home/wx766"
      layer: web_api
      expected_result: "TypeError: deepseek_tokenizer_json_default.bytes is not a function"
verification:
  status: passed
  steps:
    - id: rebuild
      action: "Run ./setup.sh to rebuild and install native binary"
      expected: "Build succeeds with embedded assets; no compile error"
      status: passed
    - id: run-help
      action: "Run deepseek-spec --help"
      expected: "Exits 0, prints usage — no TypeError"
      status: passed
  evidence:
    - ev-verification
